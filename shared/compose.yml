# =============================================================================
# FalconPulsar — Production Stack
# =============================================================================
#
# This compose file is dropped into place by the FalconPulsar installer.
# It expects a `.env` file alongside it (in the same directory) containing
# at least the following variables:
#
#   FP_ADMIN_USER       admin username (default: admin)
#   FP_DATA_DIR         absolute host path for the database directory
#   FP_UID              numeric host UID for the falconpulsar user (Linux/WSL only;
#                       on macOS this is the current user's UID)
#   FP_GID              numeric host GID for the falconpulsar user
#
# Optional environment variables (with defaults):
#
#   FP_REGISTRY         Container registry prefix (default: docker.io/falconpulsar).
#                       Change to use a mirror or private registry — the
#                       three image references below resolve against this
#                       prefix. Host the images yourself on any OCI-compliant
#                       registry (GHCR, Quay, Harbor, AWS ECR, GCR, Azure
#                       ACR, self-hosted) and update this value accordingly.
#   FP_VERSION          Image tag to pull (default: latest). Set to a
#                       specific semver tag (e.g. v0.1.0) to pin a release
#                       and stop floating with `latest`.
#   FP_ADMIN_PASS       admin password — only set during the first install,
#                       passed via the parent shell environment, NEVER stored
#                       in .env. Required only on first run when the core's
#                       data directory is empty. After first-run init, core
#                       reads its hashed password from the database and never
#                       needs the plaintext again.
#   FP_API_KEY          AI gateway service token, written to .env by the
#                       installer after first-run init via REST API
#                       /api/v1/tokens. Used by the ai-gateway container as
#                       its Bearer auth header. Limited permission set —
#                       see shared/lib/bootstrap.sh.
#   FP_REST_PORT        REST API port (default 7433)
#   FP_WS_PORT          WebSocket port (default 7434)
#   FP_PUBSUB_PORT      Pub/Sub WebSocket port (default 7435)
#   FP_GATEWAY_PORT     AI Gateway port (default 7436)
#   FP_UI_PORT          Web UI port (default 8080)
#   FP_LOG_LEVEL        debug, info, warn, error (default info)
#   ANTHROPIC_API_KEY   Anthropic API key for the AI Gateway (optional)
#   XAI_API_KEY         xAI API key for the AI Gateway (optional)
#
# Do NOT edit this file by hand — re-running the installer will overwrite it.
# To customize beyond what the installer asks, copy it to compose.local.yml
# and use `docker compose -f compose.yml -f compose.local.yml up -d`.
# =============================================================================

name: falconpulsar

services:

  # ── Core: time-series database, REST API, WebSocket pub/sub ──────────────
  core:
    image: ${FP_REGISTRY:-docker.io/falconpulsar}/core:${FP_VERSION:-latest}
    container_name: falconpulsar-core
    restart: unless-stopped
    user: "${FP_UID}:${FP_GID}"
    ports:
      - "${FP_REST_PORT:-7433}:7433"
      - "${FP_WS_PORT:-7434}:7434"
      - "${FP_PUBSUB_PORT:-7435}:7435"
    volumes:
      # Bind-mount the host data directory. The container's process runs as
      # the same UID as the host falconpulsar user, so file ownership lines
      # up cleanly. The first-run init reads init.json from this directory
      # if it exists.
      - "${FP_DATA_DIR}:/data"
    environment:
      FP_DATA_DIR: /data
      FP_BIND: 0.0.0.0
      FP_REST_PORT: "7433"
      FP_WS_PORT: "7434"
      FP_PUBSUB_PORT: "7435"
      FP_LOG_LEVEL: ${FP_LOG_LEVEL:-info}
      FP_ADMIN_USER: ${FP_ADMIN_USER:-admin}
      # Optional after first-run init. The installer passes this via the
      # parent shell on the very first `docker compose up -d core`, so the
      # core entrypoint can do --init-auto. After that the value stays empty
      # forever and the entrypoint skips re-init because the config file
      # already exists.
      FP_ADMIN_PASS: ${FP_ADMIN_PASS:-}
    healthcheck:
      # Bash /dev/tcp port-open check. The core process binds the REST port
      # only after init-auto completes, so this is effectively a readiness
      # check. start_period is generous (90s) to allow first-run init.
      test: ["CMD-SHELL", "bash -c '< /dev/tcp/localhost/7433' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    networks:
      - falconpulsar

  # ── UI: nginx serving the React SPA ─────────────────────────────────────
  ui:
    image: ${FP_REGISTRY:-docker.io/falconpulsar}/ui:${FP_VERSION:-latest}
    container_name: falconpulsar-ui
    restart: unless-stopped
    ports:
      - "${FP_UI_PORT:-8080}:8080"
    depends_on:
      core:
        condition: service_healthy
    networks:
      - falconpulsar

  # ── AI Gateway: FastAPI service brokering LLM tool calls ────────────────
  ai-gateway:
    image: ${FP_REGISTRY:-docker.io/falconpulsar}/ai-gateway:${FP_VERSION:-latest}
    container_name: falconpulsar-ai-gateway
    restart: unless-stopped
    ports:
      - "${FP_GATEWAY_PORT:-7436}:7436"
    depends_on:
      core:
        condition: service_healthy
    environment:
      FALCONPULSAR_URL: http://core:7433
      # Bearer service token written to .env by the installer after
      # first-run init. The gateway authenticates as itself using this
      # token instead of the admin username/password. The token has a
      # limited permission set — see shared/lib/bootstrap.sh.
      FP_API_KEY: ${FP_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
    networks:
      - falconpulsar

# ── Network — bridge between the three services ─────────────────────────
networks:
  falconpulsar:
    name: falconpulsar
    driver: bridge
