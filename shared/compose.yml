# =============================================================================
# FalconPulsar — Production Stack
# =============================================================================
#
# This compose file is dropped into place by the FalconPulsar installer.
# It expects a `.env` file alongside it (in the same directory) containing
# at least the following variables:
#
#   FP_ADMIN_USER       admin username (default: admin)
#   FP_DATA_DIR         absolute host path for the database directory
#   FP_UID              numeric host UID for the falconpulsar user (Linux/WSL only;
#                       on macOS this is the current user's UID)
#   FP_GID              numeric host GID for the falconpulsar user
#
# Optional environment variables (with defaults):
#
#   FP_REGISTRY         Container registry prefix (default: falconpulsar).
#                       Change to use a mirror or private registry — the
#                       three image references below resolve against this
#                       prefix. Host the images yourself on any OCI-compliant
#                       registry (GHCR, Quay, Harbor, AWS ECR, GCR, Azure
#                       ACR, self-hosted) and update this value accordingly.
#   FP_VERSION          Image tag to pull (default: latest). Set to a
#                       specific semver tag (e.g. v0.1.0) to pin a release
#                       and stop floating with `latest`.
#   FP_ADMIN_PASS       admin password — only set during the first install,
#                       passed via the parent shell environment, NEVER stored
#                       in .env. Required only on first run when the core's
#                       data directory is empty. After first-run init, core
#                       reads its hashed password from the database and never
#                       needs the plaintext again.
#   FP_API_KEY          AI gateway service token, written to .env by the
#                       installer after first-run init via REST API
#                       /api/v1/tokens. Used by the ai-gateway container as
#                       its Bearer auth header. Limited permission set —
#                       see shared/lib/bootstrap.sh.
#   FP_BRIDGE_TOKEN     Shared internal-only secret for the Core→Gateway
#                       bridge calls. Both core and ai-gateway containers
#                       must receive the same value. Generated at install
#                       time by the installer (32+ random bytes hex). If
#                       unset, ai-gateway rejects /api/v1/bridge/* with 503
#                       (SEC-001 fail-closed). Rotate by overwriting in
#                       .env and `docker compose up -d` — no rebuild needed.
#   FP_ALLOWED_ORIGINS  Comma-separated CORS allowlist for the AI Gateway.
#                       Empty falls back to the dev defaults baked into
#                       main.py (localhost UI + tauri shell). Set when the
#                       UI is served from a non-default origin.
#   FP_REST_PORT        REST API port (default 7433)
#   FP_WS_PORT          WebSocket port (default 7434)
#   FP_PUBSUB_PORT      Pub/Sub WebSocket port (default 7435)
#   FP_GATEWAY_PORT     AI Gateway port (default 7436)
#   FP_UI_PORT          Web UI port (default 8080)
#   FP_LOG_LEVEL        debug, info, warn, error (default info)
#
# LLM provider credentials (Anthropic, xAI, OpenAI, Ollama, etc.) are NOT
# stored in this file or .env — they are configured via the Web UI
# (Settings > AI Configuration) and persisted in the Core database, then
# read by the AI gateway over the REST API at runtime.
#
# Do NOT edit this file by hand — re-running the installer will overwrite it.
# To customize beyond what the installer asks, copy it to compose.local.yml
# and use `docker compose -f compose.yml -f compose.local.yml up -d`.
# =============================================================================

name: falconpulsar

services:

  # ── Core: time-series database, REST API, WebSocket pub/sub ──────────────
  core:
    image: ${FP_REGISTRY:-falconpulsar}/core:${FP_VERSION:-latest}
    container_name: falconpulsar-core
    restart: unless-stopped
    user: "${FP_UID}:${FP_GID}"
    ports:
      - "${FP_REST_PORT:-7433}:7433"
      - "${FP_WS_PORT:-7434}:7434"
      - "${FP_PUBSUB_PORT:-7435}:7435"
    volumes:
      # Bind-mount the host data directory. The container's process runs as
      # the same UID as the host falconpulsar user, so file ownership lines
      # up cleanly. The first-run init reads init.json from this directory
      # if it exists.
      - "${FP_DATA_DIR}:/data"
    environment:
      FP_DATA_DIR: /data
      FP_BIND: 0.0.0.0
      FP_REST_PORT: "7433"
      FP_WS_PORT: "7434"
      FP_PUBSUB_PORT: "7435"
      FP_LOG_LEVEL: ${FP_LOG_LEVEL:-info}
      FP_ADMIN_USER: ${FP_ADMIN_USER:-admin}
      # Optional after first-run init. The installer passes this via the
      # parent shell on the very first `docker compose up -d core`, so the
      # core entrypoint can do --init-auto. After that the value stays empty
      # forever and the entrypoint skips re-init because the config file
      # already exists.
      FP_ADMIN_PASS: ${FP_ADMIN_PASS:-}
      # SEC-001: shared secret core→gateway uses on /api/v1/bridge/* calls.
      # Both core and ai-gateway must see the same value, otherwise bridge
      # calls return 401 (wrong token) / 503 (gateway unconfigured).
      FP_BRIDGE_TOKEN: ${FP_BRIDGE_TOKEN:-}
      # Tell Core where to reach the AI Gateway for bridge calls.
      # Without this, Core's gateway_http_post() falls back to
      # "127.0.0.1:7436" which inside Core's container resolves to
      # Core itself (not the ai-gateway service). The Docker DNS name
      # "ai-gateway" resolves to the gateway container on the shared
      # network. Recognised by fpd/main.c (FP_GATEWAY_URL env override
      # for the [endpoints].gateway TOML field).
      FP_GATEWAY_URL: http://ai-gateway:7436
      # Front-door HTTPS declaration. Read by core's --init-auto and
      # persisted to falconpulsar.toml; subsequent restarts read the
      # value from the TOML so this env stays empty after first run.
      # Set to "false" for HTTP-only deployments on trusted LANs.
      FP_COOKIE_SECURE: ${FP_COOKIE_SECURE:-true}
    healthcheck:
      # Bash /dev/tcp port-open check. The core process binds the REST port
      # only after init-auto completes, so this is effectively a readiness
      # check. start_period is generous (90s) to allow first-run init.
      test: ["CMD-SHELL", "bash -c '< /dev/tcp/localhost/7433' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    networks:
      - falconpulsar

  # ── UI: nginx serving the React SPA ─────────────────────────────────────
  ui:
    image: ${FP_REGISTRY:-falconpulsar}/ui:${FP_VERSION:-latest}
    container_name: falconpulsar-ui
    restart: unless-stopped
    ports:
      - "${FP_UI_PORT:-8080}:8080"
    environment:
      # The origins the shell is permitted to embed. The image turns this into
      # the CSP `frame-src` and `connect-src` at container start; with it
      # unset, the browser refuses to render either surface and the Workplace
      # and Agents modes are blank rectangles with nothing in the console to
      # say why.
      #
      # These are BROWSER-VISIBLE origins, so they cannot be the compose
      # service names: the surfaces are framed by origin, not proxied through
      # this nginx. FP_PUBLIC_HOST is whatever a user types in the address
      # bar — localhost for a workstation install, the machine's hostname or
      # address for anything reached from another computer.
      FP_SURFACE_ORIGINS: "http://${FP_PUBLIC_HOST:-localhost}:${FP_COPILOT_PORT:-8090} http://${FP_PUBLIC_HOST:-localhost}:${FP_ENGINE_PORT:-8085}"
    volumes:
      # Override the built-in nginx.conf so AI Gateway DNS is resolved lazily.
      # Without this mount, the image's default upstream{} block crashes
      # nginx if it starts before the ai-gateway container is resolvable
      # on the compose network.
      - "${FP_HOME:-.}/nginx.conf:/etc/nginx/nginx.conf:ro"
    depends_on:
      core:
        condition: service_healthy
    networks:
      - falconpulsar

  # ── AI Gateway: FastAPI service brokering LLM tool calls ────────────────
  # Mandatory component — installed and started on every deployment, same
  # as core and ui. LLM providers/models are configured post-install via
  # the Web UI (Settings > AI Configuration).
  ai-gateway:
    image: ${FP_REGISTRY:-falconpulsar}/ai-gateway:${FP_VERSION:-latest}
    container_name: falconpulsar-ai-gateway
    restart: unless-stopped
    user: "${FP_UID}:${FP_GID}"
    ports:
      # SEC-001: bind to ${FP_GATEWAY_BIND:-127.0.0.1} by default so the
      # gateway is not reachable from outside the host. Browser clients
      # reach it via the nginx UI container proxy (internal docker DNS).
      # Set FP_GATEWAY_BIND=0.0.0.0 in .env only if you need direct LAN
      # access (and you understand auth is bearer-token only).
      - "${FP_GATEWAY_BIND:-127.0.0.1}:${FP_GATEWAY_PORT:-7436}:7436"
    volumes:
      # Persistent storage for conversations, user memory, and knowledge
      # embeddings. Without this mount, all AI Gateway state is lost on
      # container restart.
      - "${FP_GATEWAY_DATA_DIR:-${FP_DATA_DIR}/../ai-gateway-data}:/app/data"
      # Gateway configuration file — mounted from the host so users can
      # edit it without rebuilding the image. The default is copied by
      # the installer; edits take effect after `docker compose restart`.
      - "${FP_GATEWAY_CONFIG:-${FP_DATA_DIR}/../gateway.yaml}:/app/config/gateway.yaml:ro"
    depends_on:
      core:
        condition: service_healthy
    environment:
      FALCONPULSAR_URL: http://core:7433
      # Bearer service token written to .env by the installer after
      # first-run init. The gateway authenticates as itself using this
      # token instead of the admin username/password. The token has a
      # limited permission set — see shared/lib/bootstrap.sh.
      FP_API_KEY: ${FP_API_KEY:-}
      # SEC-003: key used to encrypt LLM provider API keys at rest in the
      # gateway's ai_config.db (Fernet, derived via SHA-256). Generated by
      # the installer/enable flows. If unset, the gateway falls back to
      # storing provider keys in plaintext (legacy mode).
      FP_GATEWAY_SECRET: ${FP_GATEWAY_SECRET:-}
      # Worker pool size. Each worker that serves vector work lazily loads
      # its own ~1.3GB embedding model, so 4 workers can reach ~5.5GB RSS.
      # 0 = the gateway default, min(cpu_count, 4). Memory-constrained hosts
      # want 2.
      FP_GATEWAY_WORKERS: ${FP_GATEWAY_WORKERS:-0}
      # Wave 3: refuse to start AI Gateway if encryption / bridge secrets are empty.
      # Installer always mints these into .env; this is a belt-and-suspenders gate.
      FP_REQUIRE_SECRETS: ${FP_REQUIRE_SECRETS:-1}
      # SEC-001: must match the value passed to the core container so the
      # gateway's AuthMiddleware accepts incoming /api/v1/bridge/* calls
      # from core. If unset, the gateway returns 503 on every bridge call
      # (fail-closed — see auth.py).
      FP_BRIDGE_TOKEN: ${FP_BRIDGE_TOKEN:-}
      # HMAC secret for write-confirmation IDs (multi-worker must share one
      # value). Generated once by the installer; never rotate casually —
      # in-flight Confirm buttons stop verifying until re-issued.
      FP_CONFIRM_SECRET: ${FP_CONFIRM_SECRET:-}
      # SEC-001: CORS allowlist. Comma-separated list of origins that the
      # web UI / Tauri shell will hit the gateway from. Empty = main.py
      # bakes in safe localhost dev defaults. Override when the UI is
      # served from a custom origin.
      FP_ALLOWED_ORIGINS: ${FP_ALLOWED_ORIGINS:-}
      # Print a C-level traceback if a worker dies on a fatal signal
      # (SIGSEGV/SIGABRT/SIGBUS). The gateway loads native libraries
      # in-process (onnxruntime via fastembed/chromadb for knowledge
      # embeddings); without this a native crash kills the worker
      # silently — uvicorn logs only "Child process died" and the client
      # sees a bare 502 ("AI service temporarily unavailable"). Costs
      # nothing at runtime and only emits output on an actual crash.
      PYTHONFAULTHANDLER: "1"
      # LLM provider credentials are loaded from the Core DB via REST at
      # runtime (Settings > AI Configuration in the Web UI). Do NOT inject
      # ANTHROPIC_API_KEY / XAI_API_KEY here — they would bypass the DB
      # and create a stale, hard-to-rotate secret path.
    healthcheck:
      # Bash /dev/tcp port-open check, same pattern as core. The gateway
      # image deliberately ships without curl (it pulled a CVE-flagged
      # libnghttp2 into the image), so this mirrors the bash-built-in
      # probe the image's own HEALTHCHECK uses. start_period is generous
      # to cover first-boot knowledge-base seeding.
      test: ["CMD-SHELL", "bash -c '< /dev/tcp/localhost/7436' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    networks:
      - falconpulsar

  # ── AI Engine (STANDARD) — author / simulate / deploy agents ───────────
  # Installed with every stack: no compose profile, no opt-out.
  #
  # This header used to read "OPTIONAL / opt-in only, gated behind the engine
  # compose profile, so a default install never starts it" — contradicting
  # the "no compose profile" note eleven lines below, and outliving the
  # change that made the engine standard. Stale comments like that are why
  # the tray apps kept gating a mandatory service behind an opt-in flag long
  # after the flag stopped meaning anything.
  #
  # FP_AI_ENGINE_ENABLED survives only as a health-check hint
  # (FP_ENGINE_REQUIRED below, default true). The installers force it to
  # "true" and deliberately do not carry a stale "false" forward.
  #
  # IMPORTANT: like Core and the Gateway, its config + agent state live in the
  # SHARED main folder (~/falconpulsar/ai-engine-data) via the bind mount
  # below — never inside the app image/volume. The default resolves to the
  # sibling of the Core data dir, so it always lands in the main home.
  ai-engine:
    image: ${FP_REGISTRY:-falconpulsar}/ai-engine:${FP_VERSION:-latest}
    container_name: falconpulsar-ai-engine
    restart: unless-stopped
    user: "${FP_UID}:${FP_GID}"
    # AI Engine is a standard stack service (no compose profile) — always
    # installed alongside Core / Web UI / AI Gateway.
    # No published host port. Since the single-origin fold the Agents UI is
    # reached ONLY through the shell's own nginx at /engine/ (same origin),
    # never on its own port — a surface must not be callable outside the shell.
    # It stays on the internal network as ai-engine:8085 for the shell's nginx
    # and inter-service calls; the shell's /engine/ block proxies to it there.
    volumes:
      - "${FP_ENGINE_DATA_DIR:-${FP_DATA_DIR}/../ai-engine-data}:/data"
    depends_on:
      core:
        condition: service_healthy
    environment:
      FP_PORT: "8085"
      # As for Copilot: sets this surface's `frame-ancestors` and the
      # <meta name="fp-shell-origin"> the embedded page reads to decide which
      # parent may hand it a session. See the note on the ui service.
      FP_SHELL_ORIGIN: "http://${FP_PUBLIC_HOST:-localhost}:${FP_UI_PORT:-8080}"
      FP_CORE_URL: http://core:7433
      FP_CORE_WS: ws://core:7434/ws
      FP_AI_GATEWAY_URL: http://ai-gateway:7436
      # Bearer service token (the same one Core mints for the gateway),
      # written to .env by the installer after first-run init.
      FP_CORE_TOKEN: ${FP_CORE_TOKEN:-${FP_API_KEY:-}}
      # Key material for encrypting connection credentials at rest in the
      # engine's SQLite registry (services/bff/src/secrets.ts derives an
      # engine-specific key from it via HKDF). Deliberately the gateway
      # secret and NOT FP_API_KEY: this must have a stable lifecycle, and a
      # rotating service token would orphan every stored credential.
      FP_GATEWAY_SECRET: ${FP_GATEWAY_SECRET:-}
      # Where the Command Center lives, and the key to speak in it. Both are
      # required before a runbook posts its report into an incident room;
      # with either absent the report stays on the incident timeline, which
      # is the whole behaviour when no Copilot is deployed.
      FP_COPILOT_URL: http://copilot:8080
      FP_CC_MACHINE_KEY: ${FP_CC_MACHINE_KEY:-}
      # Never enable simulation mode on a production host — it trusts client role
      # headers (x-fp-role / x-fp-user) and is a full auth bypass.
      FP_SIM: ${FP_SIM:-}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8085/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - falconpulsar

  # ── Command Center / Copilot (OPTIONAL) — ops workspace ────────────────
  # Same data-dir pattern as Core and AI Engine:
  #   host:  ${FP_COPILOT_DATA_DIR}  (installer: $FP_HOME/copilot-data)
  #   mount: → /data
  #   user:  ${FP_UID}:${FP_GID} so ownership matches Core
  #   env:   FP_COPILOT_DATA_DIR=/data (in-container path only)
  # Stack config (auth-policy.json) lives in FP_HOME like gateway.yaml.
  #
  # Opt-in: profile "copilot". Installer sets FP_COPILOT_ENABLED=true and
  # adds "copilot" to COMPOSE_PROFILES.
  copilot:
    image: ${FP_REGISTRY:-falconpulsar}/copilot:${FP_COPILOT_IMAGE_TAG:-${FP_VERSION:-latest}}
    container_name: falconpulsar-copilot
    restart: unless-stopped
    user: "${FP_UID}:${FP_GID}"
    profiles: ["copilot"]
    # No published host port — reached ONLY through the shell at /copilot/
    # (single-origin fold). Internal network only, as copilot:8080; the shell's
    # /copilot/ nginx block proxies to it there. A surface is never externally
    # callable outside the shell.
    environment:
      # The shell's origin. Two things depend on it: the `frame-ancestors`
      # this surface sends, and the <meta name="fp-shell-origin"> it puts in
      # its HTML so the embedded page knows which parent to accept a session
      # handshake from. Left unset it falls back to the dev shell on 5173,
      # which is wrong for every real install — the handshake is refused and
      # the surface asks for a second login inside the frame.
      FP_SHELL_ORIGIN: "http://${FP_PUBLIC_HOST:-localhost}:${FP_UI_PORT:-8080}"
      # In-container data root (host path is only the bind mount source).
      FP_COPILOT_DATA_DIR: /data
      FP_CC_DEPLOYMENT_MODE: plant
      # AI Engine is a standard service now, so the default is true — a .env
      # predating that change (no key) must not tell Command Center the engine
      # is absent while the container is in fact running.
      FP_ENGINE_REQUIRED: ${FP_AI_ENGINE_ENABLED:-true}
      FP_AI_GATEWAY_HOST: ai-gateway
      FP_AI_GATEWAY_PORT: "7436"
      FP_AI_ENGINE_HOST: ai-engine
      FP_AI_ENGINE_PORT: "8085"
      FP_CORE_HOST: core
      FP_CORE_PORT: "7433"
      # The door a MACHINE posts room messages through (an Engine runbook
      # filing its first look on an incident). Unset closes the door — the
      # server refuses every machine post rather than treating a missing
      # secret as "allow all".
      FP_CC_MACHINE_KEY: ${FP_CC_MACHINE_KEY:-}
    volumes:
      # Module state (SQLite) — parallel to Core FP_DATA_DIR→/data
      - "${FP_COPILOT_DATA_DIR:-${FP_DATA_DIR}/../copilot-data}:/data"
      # Install-time policy (stack root, like gateway.yaml)
      - "${FP_HOME:-.}/auth-policy.json:/config/auth-policy.json:ro"
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-qO',
          '/dev/null',
          'http://127.0.0.1:8080/health',
        ]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3
    networks:
      - falconpulsar

# ── Network — bridge between the three services ─────────────────────────
networks:
  falconpulsar:
    name: falconpulsar
    driver: bridge
