# =============================================================================
# FalconPulsar Web UI — Nginx Configuration
#
# - Serves static SPA files
# - Reverse proxies API calls to Core (7433) and AI Gateway (7436)
# - Adds CORS headers (Core server doesn't implement them)
# - Rate-limits /auth/login to prevent brute force
# - WebSocket upgrade support for real-time data
# =============================================================================

worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ─────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # ── Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # ── Rate limiting ───────────────────────────────────────────────────
    # 10 requests/sec per IP for auth endpoints (brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    # 100 requests/sec per IP for general API (prevents abuse)
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    # ── Upstreams ───────────────────────────────────────────────────────
    # Service names resolve via Docker DNS
    upstream core {
        server core:7433;
        keepalive 16;
    }

    upstream core_ws {
        server core:7434;
    }

    upstream core_pubsub {
        server core:7435;
    }

    # NOTE: ai-gateway is NOT defined as an upstream{} block because nginx
    # resolves upstream hostnames at startup — when the AI Gateway container
    # is disabled (compose profile), the hostname doesn't exist in Docker DNS
    # and nginx refuses to start entirely. Instead, we use a variable-based
    # proxy_pass with Docker's internal resolver (127.0.0.11) so DNS lookups
    # happen lazily at request time. Requests return 502 when the gateway is
    # off; the UI detects this and hides AI features.

    # ── Server Block ────────────────────────────────────────────────────
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Docker internal DNS — needed for variable-based proxy_pass so
        # nginx can resolve container names at request time, not at startup.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # ── Security Headers ────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ── Health check (nginx itself) ─────────────────────────────────
        location = /health {
            access_log off;
            return 200 '{"status":"ok","service":"ui"}';
            add_header Content-Type application/json;
        }

        # ── Auth endpoints — rate limited ───────────────────────────────
        location /api/v1/auth/login {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://core;
            include /etc/nginx/proxy_params_api;
        }

        # ── AI Gateway routes ───────────────────────────────────────────
        # Variable-based proxy_pass so nginx doesn't crash on startup when
        # the ai-gateway container is disabled. Returns 502 when off.
        location /api/v1/chat {
            set $gw http://ai-gateway:7436;
            proxy_pass $gw;
            include /etc/nginx/proxy_params_sse;
        }

        location /api/v1/models {
            set $gw http://ai-gateway:7436;
            proxy_pass $gw;
            include /etc/nginx/proxy_params_api;
        }

        location /api/v1/conversations {
            set $gw http://ai-gateway:7436;
            proxy_pass $gw;
            include /etc/nginx/proxy_params_api;
        }

        location /api/v1/memory {
            set $gw http://ai-gateway:7436;
            proxy_pass $gw;
            include /etc/nginx/proxy_params_api;
        }

        location /api/v1/ai {
            set $gw http://ai-gateway:7436;
            proxy_pass $gw;
            include /etc/nginx/proxy_params_api;
        }

        # ── Core REST API ───────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://core;
            include /etc/nginx/proxy_params_api;
        }

        # ── WebSocket — real-time data ──────────────────────────────────
        location /ws {
            proxy_pass http://core_ws;
            include /etc/nginx/proxy_params_ws;
        }

        # ── Pub/Sub WebSocket ───────────────────────────────────────────
        location /pubsub {
            proxy_pass http://core_pubsub;
            include /etc/nginx/proxy_params_ws;
        }

        # ── Static files — SPA routing ──────────────────────────────────
        # Hashed assets (immutable cache)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # All other routes — SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
