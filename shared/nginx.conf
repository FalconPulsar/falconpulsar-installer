# =============================================================================
# FalconPulsar Web UI — Nginx Configuration
#
# - Serves static SPA files
# - Reverse proxies API calls to Core (7433) and AI Gateway (7436)
# - Adds CORS headers (Core server doesn't implement them)
# - Rate-limits /auth/login to prevent brute force
# - WebSocket upgrade support for real-time data
# =============================================================================

worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ─────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # ── Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # ── Rate limiting ───────────────────────────────────────────────────
    # 10 requests/sec per IP for auth endpoints (brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    # General API (prevents abuse). 300r/s with a matching data-plane burst:
    # a board open legitimately fires 100+ parallel GETs (per-series
    # engineering + history + latest for every widget) and measurably lost
    # 96 of a 150-request boot burst to 503s at 100r/s/burst=50 — the app's
    # own normal behaviour read as abuse. AI routes keep their tighter burst
    # below; auth keeps its own strict zone. Mirrors falconpulsar-ui
    # docker/nginx.conf — this mounted copy is what deployments actually run.
    limit_req_zone $binary_remote_addr zone=api:10m rate=300r/s;

    # ── Upstreams ───────────────────────────────────────────────────────
    # Service names resolve via Docker DNS
    upstream core {
        server core:7433;
        keepalive 16;
    }

    upstream core_ws {
        server core:7434;
    }

    upstream core_pubsub {
        server core:7435;
    }

    # NOTE: ai-gateway is NOT defined as an upstream{} block because nginx
    # resolves upstream hostnames at startup — when the AI Gateway container
    # is disabled (compose profile), the hostname doesn't exist in Docker DNS
    # and nginx refuses to start entirely. Instead, we use a variable-based
    # proxy_pass with Docker's internal resolver (127.0.0.11) so DNS lookups
    # happen lazily at request time. Requests return 502 when the gateway is
    # off; the UI detects this and hides AI features.

    # ── Conditional Connection header (single-origin fold) ──────────────
    # 'upgrade' for a WebSocket handshake, 'close' otherwise — lets ONE
    # location serve plain HTTP and WebSocket both, which the folded
    # /copilot/ and /engine/ surfaces need. The hardcoded `Connection
    # upgrade` in proxy_params_ws cannot; this map can.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Server Block ────────────────────────────────────────────────────
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Docker internal DNS — needed for variable-based proxy_pass so
        # nginx can resolve container names at request time, not at startup.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # ── Security Headers ────────────────────────────────────────────
        # Defense-in-depth posture for an industrial app that may run
        # in air-gapped, on-prem, or cloud-public modes. Threat model
        # treats XSS as a realistic attack path, so the Content-
        # Security-Policy below is enforcing (not report-only).
        #
        # CSP rationale (one directive per line):
        #   default-src 'self'         — fallback: only same-origin.
        #   script-src 'self'          — no inline scripts, no eval.
        #                                 Vite's prod bundle has no
        #                                 inline scripts; we audited.
        #   style-src 'self' 'unsafe-inline'
        #                              — React `style={{...}}` props
        #                                emit inline `style=` attrs;
        #                                blocking them is impractical
        #                                without a major refactor.
        #                                Style-XSS is much narrower
        #                                than script-XSS. Fonts are
        #                                bundled (no CDN exception).
        #   font-src 'self' data:      — bundled @fontsource/* fonts
        #                                + data: for inlined glyph
        #                                fallbacks. NO external CDNs
        #                                — air-gap deployments work
        #                                offline.
        #   img-src 'self' data: blob:
        #                              — bundled assets, data URIs
        #                                (chart screenshots), blob:
        #                                (file uploads). NO external
        #                                hosts — prevents tracking
        #                                pixels and data exfil via
        #                                <img src=evil.com/?...>.
        #   connect-src 'self' ws: wss:
        #                              — same-origin XHR/fetch +
        #                                WebSocket. `'self'` does
        #                                NOT cover ws:/wss: in CSP
        #                                (different scheme), so we
        #                                add them explicitly.
        #   worker-src 'self' blob:    — Vite ships some workers as
        #                                blob: URLs.
        #   object-src 'none'          — no Flash / plugins.
        #   frame-ancestors 'none'     — block being framed (clickjack).
        #                                Supersedes X-Frame-Options for
        #                                modern browsers.
        #   base-uri 'self'            — block <base href> injection
        #                                redirecting relative URLs.
        #   form-action 'self'         — forms POST same-origin only.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # X-Frame-Options is superseded by `frame-ancestors 'none'`
        # in CSP for modern browsers, but legacy browsers (IE11, old
        # Safari) still respect this header. DENY > SAMEORIGIN — we
        # never iframe ourselves so there's no reason to allow it.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        # X-XSS-Protection is deprecated in modern browsers (replaced
        # by CSP) but doesn't hurt for legacy clients.
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Disable browser APIs we don't use. Cuts attack surface and
        # aligns with industrial / IEC 62443 minimization.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), midi=(), encrypted-media=(), interest-cohort=()" always;
        # HSTS — only takes effect over HTTPS, harmless over HTTP.
        # 1-year max-age, no preload (operators control their own
        # certs/domains; preload list is for public sites). Cloud-
        # public deployments behind TLS get the benefit; on-prem +
        # air-gap deployments without TLS just see the header
        # ignored, no breakage.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # NOTE on add_header inheritance: nginx *replaces* (does not
        # merge) parent-level add_header directives whenever a child
        # location has its own add_header. So the security headers
        # above won't actually apply to responses that match a
        # location with `add_header Cache-Control ...` etc. To work
        # around that, every location below `include`s the security
        # snippet which re-issues the same headers. Edit the policy
        # in `/etc/nginx/security_headers`, not here.

        # ── Health check (nginx itself) ─────────────────────────────────
        location = /health {
            access_log off;
            return 200 '{"status":"ok","service":"ui"}';
            add_header Content-Type application/json;
            include /etc/nginx/security_headers;
        }

        # ── Auth endpoints — rate limited ───────────────────────────────
        location /api/v1/auth/login {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://core;
            include /etc/nginx/proxy_params_api;
            include /etc/nginx/security_headers;
        }

        # ── AI Gateway routes ───────────────────────────────────────────
        # Variable-based proxy_pass so nginx doesn't crash on startup when
        # the ai-gateway container is disabled. Returns 502 when off.

        # Same-origin probe used by the UI's `discoverEndpoints` flow.
        # Front-end can't talk to the gateway's direct port (e.g.
        # http://localhost:7436) under our strict CSP (`connect-src
        # 'self'`), so the probe goes through nginx instead. Maps to
        # ai-gateway's `/health` endpoint inside the container.
        location = /api/v1/gateway-health {
            set $gw http://ai-gateway:7436;
            proxy_pass $gw/health;
            include /etc/nginx/proxy_params_api;
            include /etc/nginx/security_headers;
        }

        location /api/v1/chat {
            limit_req zone=api burst=50 nodelay;
            set $gw http://ai-gateway:7436;
            proxy_pass $gw;
            include /etc/nginx/proxy_params_sse;
            include /etc/nginx/security_headers;
        }

        location /api/v1/models {
            limit_req zone=api burst=50 nodelay;
            set $gw http://ai-gateway:7436;
            proxy_pass $gw;
            include /etc/nginx/proxy_params_api;
            include /etc/nginx/security_headers;
        }

        location /api/v1/conversations {
            limit_req zone=api burst=50 nodelay;
            set $gw http://ai-gateway:7436;
            proxy_pass $gw;
            include /etc/nginx/proxy_params_api;
            include /etc/nginx/security_headers;
        }

        location /api/v1/memory {
            limit_req zone=api burst=50 nodelay;
            set $gw http://ai-gateway:7436;
            proxy_pass $gw;
            include /etc/nginx/proxy_params_api;
            include /etc/nginx/security_headers;
        }

        location /api/v1/ai {
            limit_req zone=api burst=50 nodelay;
            set $gw http://ai-gateway:7436;
            proxy_pass $gw;
            include /etc/nginx/proxy_params_api;
            include /etc/nginx/security_headers;
        }

        # Smart FPQ proxy — the Workspace chat posts /api/v1/fpq/query here.
        # Without this block it fell through to the Core catch-all below,
        # which has no such route, so every direct FPQ query in chat failed
        # with a bare "Not Found".
        location /api/v1/fpq {
            limit_req zone=api burst=50 nodelay;
            set $gw http://ai-gateway:7436;
            proxy_pass $gw;
            include /etc/nginx/proxy_params_api;
            include /etc/nginx/security_headers;
        }

        # External-database bridge (SQL/Mongo/Influx/files) — same problem:
        # it is a gateway route and must not fall through to Core.
        location /api/v1/bridge {
            limit_req zone=api burst=50 nodelay;
            set $gw http://ai-gateway:7436;
            proxy_pass $gw;
            include /etc/nginx/proxy_params_api;
            include /etc/nginx/security_headers;
        }

        # ── AI Engine fleet metrics ─────────────────────────────────────
        # The shell's Observatory reads the Engine's fleet snapshot through
        # here rather than talking to the Engine's origin directly, so the
        # request carries the shell's session and is not a cross-origin call.
        #
        # A variable upstream, so nginx still starts when ai-engine is not on
        # the network — a literal one is resolved at config load and takes the
        # whole Web UI down with it when the Engine is absent.
        location /api/v1/engine/ {
            limit_req zone=api burst=50 nodelay;
            set $eng http://ai-engine:8085;
            # The rewrite strips our /engine/ segment; the Engine serves its
            # API at /api/v1/. The $uri is NOT optional. With a VARIABLE in
            # proxy_pass and no URI part, nginx passes the request "in the same
            # form as sent by a client" — the original, not the rewritten one.
            # The rewrite above then does nothing, the Engine receives
            # /api/v1/engine/fleet/snapshot, and since that is not one of its
            # public routes the answer is 401 without a token and 404 with one.
            # Both were seen before this line was written.
            rewrite ^/api/v1/engine/(.*)$ /api/v1/$1 break;
            proxy_pass $eng$uri$is_args$args;
            include /etc/nginx/proxy_params_api;
            include /etc/nginx/security_headers;
        }

        # ── Copilot surface (SPA + BFF) same-origin under /copilot/ ─────
        # Single-origin fold: serve the Workspaces surface through the
        # shell's own origin instead of its published :8090, so there is no
        # cross-origin at all. The BFF matches UNPREFIXED paths (/api/cc,
        # /api/v1, /api/core, /api/engine, /assets, /), so we STRIP /copilot
        # before proxying — it then sees exactly the paths it serves
        # standalone (zero BFF change). Variable upstream + the shared
        # resolver, so nginx still starts when copilot's compose profile is
        # off (502, not a config-load crash) — same pattern as the gateway
        # and /api/v1/engine/ blocks above. Longest-prefix match keeps this
        # clear of /api/ and /api/v1/engine/.
        location = /copilot { return 308 /copilot/; }
        location /copilot/ {
            set $cp http://copilot:8080;
            # $uri after the rewrite is REQUIRED with a variable upstream, or
            # nginx forwards the ORIGINAL unrewritten URI (the trap the
            # /api/v1/engine/ block above documents).
            rewrite ^/copilot/(.*)$ /$1 break;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_pass $cp$uri$is_args$args;
            # Same-origin framing: the server-level CSP says frame-ancestors
            # 'none' + X-Frame-Options DENY, which would blank the iframe even
            # same-origin. Drop the BFF's own CSP too so the browser sees ONE
            # deterministic policy. Any add_header here also detaches this
            # location from the server-level headers — intended.
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Frame-Options;
            add_header Content-Security-Policy "frame-ancestors 'self'" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ── AI Engine surface (SPA + BFF + /ws) same-origin under /engine/ ─
        # As /copilot/ but the Engine also binds an exact WebSocket path /ws:
        # /engine/ws strips to /ws, and the $connection_upgrade map carries
        # the handshake through the same location that serves plain HTTP.
        # Distinct from /api/v1/engine/ (the shell's Observatory REST proxy).
        location = /engine { return 308 /engine/; }
        location /engine/ {
            set $engsurf http://ai-engine:8085;
            rewrite ^/engine/(.*)$ /$1 break;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_pass $engsurf$uri$is_args$args;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Frame-Options;
            add_header Content-Security-Policy "frame-ancestors 'self'" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ── Core REST API ───────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=300 nodelay;
            proxy_pass http://core;
            include /etc/nginx/proxy_params_api;
            include /etc/nginx/security_headers;
        }

        # ── WebSocket — real-time data ──────────────────────────────────
        location /ws {
            proxy_pass http://core_ws;
            include /etc/nginx/proxy_params_ws;
            include /etc/nginx/security_headers;
        }

        # ── Pub/Sub WebSocket ───────────────────────────────────────────
        location /pubsub {
            proxy_pass http://core_pubsub;
            include /etc/nginx/proxy_params_ws;
            include /etc/nginx/security_headers;
        }

        # ── Static files — SPA routing ──────────────────────────────────
        # Hashed assets (immutable cache)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security_headers;
            try_files $uri =404;
        }

        # All other routes — SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
            include /etc/nginx/security_headers;
        }
    }
}
