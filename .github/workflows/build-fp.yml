name: build-fp

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'console/**'
      - '.github/workflows/build-fp.yml'
  pull_request:
    branches: [main]
    paths:
      - 'console/**'
      - '.github/workflows/build-fp.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: build fp (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: arm64
            suffix: macos-arm64
          - goos: darwin
            goarch: amd64
            suffix: macos-amd64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: console/go.sum

      - name: Build
        # On tag pushes, inject the release version into cli.Version
        # via ldflags -X so `fp about` reports the real tag. On non-tag
        # pushes (PR / branch validation builds) the cli.go fallback
        # (a literal kept in sync with the VERSION file by
        # scripts/sync-version.sh) is appropriate -- those binaries
        # are CI validation, not distribution.
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          cd console
          mkdir -p dist
          LDFLAGS="-s -w"
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v ]]; then
            FP_VER="${GITHUB_REF_NAME#v}"
            LDFLAGS="$LDFLAGS -X github.com/falconpulsar/falconpulsar-installer/console/internal/cli.Version=${FP_VER}"
            echo "Building fp with cli.Version=$FP_VER (from tag $GITHUB_REF_NAME)"
          fi
          go build -ldflags="$LDFLAGS" -o dist/fp-${{ matrix.suffix }}${{ matrix.ext }} ./cmd/fp
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fp-${{ matrix.suffix }}
          path: console/dist/fp-${{ matrix.suffix }}${{ matrix.ext }}
          retention-days: 30
          if-no-files-found: error
