name: build-fp

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'console/**'
      - '.github/workflows/build-fp.yml'
  pull_request:
    branches: [main]
    paths:
      - 'console/**'
      - '.github/workflows/build-fp.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: build fp (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: arm64
            suffix: macos-arm64
          - goos: darwin
            goarch: amd64
            suffix: macos-amd64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: console/go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          cd console
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/fp-${{ matrix.suffix }}${{ matrix.ext }} ./cmd/fp
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: fp-${{ matrix.suffix }}
          path: console/dist/fp-${{ matrix.suffix }}${{ matrix.ext }}
          retention-days: 30
          if-no-files-found: error
