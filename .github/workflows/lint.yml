# =============================================================================
# Lint — shellcheck on every bash script in the installer.
#
# Runs on every push and pull request. Fails the build if shellcheck finds
# anything in the linux/, macos/, or shared/lib/ scripts.
# =============================================================================

name: lint

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          set -e
          # -x: follow source statements
          # -P: search path for sourced files
          # -e SC1091: don't fail on "can't follow non-constant source"
          #
          # EVERY tracked *.sh is listed. The list is hand-maintained, and an
          # audit found four scripts that had quietly never been checked --
          # including macos/build-dmg.sh, whose hand-written Swift file list
          # shipped v0.1.4-alpha.79 with no DMG at all, and
          # .github/scripts/bundle.sh, which produces the published
          # curl-pipe installers.
          #
          # Adding one here is easy to forget, so `shellcheck coverage` below
          # fails when a tracked .sh is missing from this list.
          shellcheck \
            -x \
            -P shared/lib \
            -e SC1091 \
            .github/scripts/bundle.sh \
            linux/install.sh \
            linux/uninstall.sh \
            linux/bootstrap.sh \
            macos/install.sh \
            macos/uninstall.sh \
            macos/build-dmg.sh \
            macos/pkg/build-pkg.sh \
            macos/installer-app/statecheck/run.sh \
            scripts/sync-version.sh \
            scripts/sync-icons.sh \
            shared/lib/common.sh \
            shared/lib/checks.sh \
            shared/lib/prompts.sh \
            shared/lib/bootstrap.sh \
            shared/lib/registry_auth.sh \
            shared/lib/auth.sh \
            shared/lib/fpcli.sh \
            shared/lib/existing.sh

      - name: shellcheck coverage
        # The list above is hand-maintained, which is exactly how four
        # scripts ended up never being linted. This makes the omission
        # mechanical instead of a matter of remembering: any tracked .sh not
        # named above fails the job with its own path.
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r f; do
            if ! grep -qF "            $f \\" .github/workflows/lint.yml \
               && ! grep -qF "            $f" .github/workflows/lint.yml; then
              echo "::error file=$f::$f is not in the shellcheck list in .github/workflows/lint.yml"
              missing=1
            fi
          done < <(git ls-files '*.sh')
          if [ "$missing" -ne 0 ]; then
            echo "Add the file(s) above to the shellcheck step, or delete them."
            exit 1
          fi
          echo "every tracked .sh is in the shellcheck list ($(git ls-files '*.sh' | wc -l | tr -d ' ') files)"

  embedded-bash:
    name: embedded WSL bash (in PowerShell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Windows installer runs bash inside WSL by generating scripts as
      # PowerShell here-strings. shellcheck on standalone *.sh never sees them,
      # so a quoting/CRLF bug there only surfaced when a user ran the installer
      # (the `set: +` and `sed '...'"$U"/'` bugs). bash -n each embedded script.
      - name: Syntax-check embedded bash
        run: python3 windows/scripts/check-embedded-bash.py

  validate-compose:
    name: validate compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate shared/compose.yml
        # Use docker compose config which fully parses + validates
        # interpolation across all three services (core, ui, ai-gateway).
        # We pass dummy values for the required env vars so the file
        # actually parses; this is a syntax check, not a runtime test.
        run: |
          cd shared
          FP_ADMIN_PASS=ci-validation \
          FP_DATA_DIR=/tmp/fp-ci \
          FP_UID=1000 \
          FP_GID=1000 \
          docker compose config >/dev/null

  version-sync:
    name: version sites match VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run sync-version.sh in check mode
        # The VERSION file at the repo root is the single source of truth.
        # scripts/sync-version.sh propagates it into every hardcoded site
        # (Go const, Swift menu titles, C# tray header, installer.iss, etc).
        # --check exits non-zero if any site has drifted, so a forgotten
        # version bump can never reach main.
        run: scripts/sync-version.sh --check

  macos-swift:
    name: macOS apps compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile the menu-bar app exactly as build-dmg.sh does
        # WHY THIS JOB EXISTS
        #
        # The DMG build step in release.yml is continue-on-error, because
        # signing and notarization depend on Apple and can fail for reasons
        # outside this repo. The side effect is that ANY failure in that step
        # is invisible: the job still reports success, the release still
        # publishes, and the only signal is a ::warning:: annotation nobody
        # reads on a green run.
        #
        # alpha.79 shipped with no macOS DMG that way. The cause was not
        # notarization at all -- it was `cannot find 'IconRenderer' in scope`,
        # because build-dmg.sh compiled a hand-written list of .swift files
        # and two new ones were not on it. `swift build` kept passing locally
        # the whole time, since Package.swift globs the directory.
        #
        # So: compile it here, on every push, with no continue-on-error and
        # no Apple secrets involved. A compile error is entirely ours and
        # must be loud; notarization failing is not and stays best-effort.
        run: |
          set -euo pipefail
          cd macos/menu-bar-app
          swiftc FalconPulsar/*.swift \
            -o /tmp/FalconPulsarMenuBar \
            -framework AppKit -framework UserNotifications -O
          echo "menu-bar app compiled: $(ls -lh /tmp/FalconPulsarMenuBar | awk '{print $5}')"

      - name: Compile the installer app
        run: |
          set -euo pipefail
          cd macos/installer-app
          swift build -c release

  notices-match-binary:
    name: THIRD_PARTY_NOTICES matches the linked binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: console/go.mod

      - name: Every linked module is listed, and nothing listed is unlinked
        # THIRD_PARTY_NOTICES.md drifted badly -- every version stale, one
        # module (mattn/go-runewidth) listed but linked on NO platform, and
        # one (inconshreveable/mousetrap) linked on Windows and absent from
        # the file. It drifted because nothing checked it.
        #
        # The union across BUILD TARGETS matters: mousetrap is a Windows-only
        # dependency of cobra, so a check that built one platform would have
        # kept missing it. Attribution has to cover what we actually ship.
        run: |
          set -euo pipefail
          cd console
          : > /tmp/linked.txt
          for t in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -o /tmp/fp-probe ./cmd/fp
            go version -m /tmp/fp-probe | awk '$1=="dep"{print $2}' >> /tmp/linked.txt
          done
          sort -u /tmp/linked.txt > /tmp/linked-sorted.txt
          grep -oE '^\| [^ |]+' ../THIRD_PARTY_NOTICES.md | sed 's/^| //' \
            | grep '^github\.com\|^golang\.org' | sort -u > /tmp/listed.txt
          if ! diff -u /tmp/listed.txt /tmp/linked-sorted.txt; then
            echo "::error::THIRD_PARTY_NOTICES.md does not match the linked modules."
            echo "  '-' = listed but not linked (remove it)"
            echo "  '+' = linked but not listed (add it -- this is the attribution failure)"
            exit 1
          fi
          echo "notices match the linked set ($(wc -l < /tmp/linked-sorted.txt) modules)"

  icon-sync:
    name: icon sites match icons.def
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run sync-icons.sh in check mode
        # shared/icons/icons.def is the single source of truth for the
        # QuickDock menu icons, and scripts/sync-icons.sh generates
        # Icons.g.cs and Icons.g.swift from it. The whole point of owning
        # the geometry is that the two platforms match BY CONSTRUCTION --
        # which stops being true the moment one generated file is edited
        # by hand or the source changes without a regeneration.
        #
        # Same guard sync-version.sh provides for VERSION, and it also
        # validates icons.def itself: both renderers accept only absolute
        # M/L/C/Z, so a stray arc or a bad mode is rejected here, where the
        # error can name the line, rather than becoming a malformed literal
        # in two languages.
        run: scripts/sync-icons.sh --check

  bundle:
    name: bundles contain their script bodies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and verify the release bundles
        # bundle.sh extracts each top-level script's body with an awk
        # anchor. If the anchor drifts out of sync with the script headers,
        # the bundle still builds, ships, and exits 0 — with no body at all
        # (exactly how the published uninstall-linux.sh once became a
        # silent no-op). Assert each bundle parses and still defines a
        # function that only its embedded body provides.
        run: |
          set -e
          out="$(mktemp -d)"
          .github/scripts/bundle.sh linux           > "$out/install-linux.sh"
          .github/scripts/bundle.sh macos           > "$out/install-macos.sh"
          .github/scripts/bundle.sh linux-uninstall > "$out/uninstall-linux.sh"
          for f in "$out"/*.sh; do
            bash -n "$f"
          done
          grep -q 'print_help()'         "$out/install-linux.sh"
          grep -q 'detect_mac_runtime()' "$out/install-macos.sh"
          grep -q 'run_as_fp_user()'     "$out/uninstall-linux.sh"

  powershell:
    name: powershell (parse + ASCII)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WHY THIS JOB EXISTS
      # A .ps1 with a syntax error shipped to a customer and failed at step 6
      # of 7 on THEIR machine, because CI linted every bash script and never
      # looked at the PowerShell at all.
      - name: Parse every .ps1
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $bad++
              Write-Host "::error file=$($_.FullName)::$($errors.Count) parse error(s)"
              $errors | ForEach-Object { Write-Host "   line $($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Host "all .ps1 files parse"

      # THE CHECK THAT WOULD ACTUALLY HAVE CAUGHT IT.
      # The parse job above runs pwsh 7, which reads a file as UTF-8 and is
      # perfectly happy with an em dash. The customer runs Windows PowerShell
      # 5.1, which reads a BOM-less .ps1 as the system ANSI code page -- so a
      # multi-byte character becomes mojibake, and inside a double-quoted
      # string one of its bytes can terminate the string early. That is
      # exactly how `... port $($surface.Port) - the shell will show ...`
      # became "The string is missing the terminator".
      #
      # Rule: .ps1 files are ASCII-only. Simple, and mechanically checkable.
      - name: No non-ASCII in .ps1 (Windows PowerShell 5.1 reads them as ANSI)
        run: |
          set -e
          if grep -rlP '[^\x00-\x7F]' --include='*.ps1' . ; then
            echo "::error::the .ps1 files listed above contain non-ASCII characters."
            echo "Windows PowerShell 5.1 reads a BOM-less .ps1 as the system ANSI code page."
            echo "Use ASCII: -- for an em dash, - for a box rule, * for a bullet."
            exit 1
          fi
          echo "all .ps1 files are ASCII-only"
