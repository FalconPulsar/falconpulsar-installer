name: build-macos

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'windows/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'windows/**'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go (for fp console CLI bundled in the DMG)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build DMG
        run: |
          chmod +x macos/build-dmg.sh
          ./macos/build-dmg.sh
          ls -lh dist/FalconPulsar-Setup.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: FalconPulsar-macOS
          path: dist/FalconPulsar-Setup.dmg
          retention-days: 30
          if-no-files-found: error
