name: build-macos

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'windows/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'windows/**'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go (for fp console CLI bundled in the DMG)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: console/go.sum

      # The wizard's navigation rules, asserted against the real state
      # machine before we bother building a DMG. A skipped
      # "Existing Installation Detected" page routes an operator with a live
      # stack into a fresh install — cheaper to catch here than in a release.
      - name: Installer wizard navigation rules
        run: macos/installer-app/statecheck/run.sh

      - name: Build DMG
        run: |
          chmod +x macos/build-dmg.sh
          ./macos/build-dmg.sh
          ls -lh dist/FalconPulsar-Setup.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FalconPulsar-macOS
          path: dist/FalconPulsar-Setup.dmg
          retention-days: 30
          if-no-files-found: error
