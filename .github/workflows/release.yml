# =============================================================================
# release — bundle the Linux and macOS installers into a single self-contained
# script per platform and publish them as a GitHub Release on every v* tag.
#
# We bundle so that `curl -fsSL .../install-linux.sh | bash` works without
# requiring the user to clone the repo. The bundle inlines shared/lib/*.sh
# and shared/compose.yml into the install.sh so it can run standalone.
#
# Triggered by pushing a tag like v0.1.0.
# =============================================================================

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bundle:
    name: bundle linux + macos installers
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bundle Linux installer
        run: |
          mkdir -p dist
          ./.github/scripts/bundle.sh linux > "dist/install-linux-${GITHUB_REF_NAME}.sh"
          chmod +x "dist/install-linux-${GITHUB_REF_NAME}.sh"
          # Unversioned alias for stable redirect URLs.
          cp "dist/install-linux-${GITHUB_REF_NAME}.sh" dist/install-linux.sh

      - name: Bundle Linux uninstaller
        run: |
          # Self-contained uninstall bundle for users whose machine no longer
          # has ~/falconpulsar/uninstall.sh (broken install, manual cleanup).
          # curl -fsSL .../uninstall-linux.sh | sudo bash
          ./.github/scripts/bundle.sh linux-uninstall > "dist/uninstall-linux-${GITHUB_REF_NAME}.sh"
          chmod +x "dist/uninstall-linux-${GITHUB_REF_NAME}.sh"
          cp "dist/uninstall-linux-${GITHUB_REF_NAME}.sh" dist/uninstall-linux.sh

      - name: Ship Linux bootstrap (dispatcher)
        run: |
          # linux.sh is the tiny dispatcher served at
          # https://get.falconpulsar.com/linux. It downloads both bundles
          # above on every run and execs the one the user asked for
          # (default: install; `-s -- uninstall` for uninstall).
          cp linux/bootstrap.sh "dist/linux-${GITHUB_REF_NAME}.sh"
          chmod +x "dist/linux-${GITHUB_REF_NAME}.sh"
          cp "dist/linux-${GITHUB_REF_NAME}.sh" dist/linux.sh

      - name: Bundle macOS installer
        run: |
          ./.github/scripts/bundle.sh macos > "dist/install-macos-${GITHUB_REF_NAME}.sh"
          chmod +x "dist/install-macos-${GITHUB_REF_NAME}.sh"
          cp "dist/install-macos-${GITHUB_REF_NAME}.sh" dist/install-macos.sh

      # No separate copy of compose.yml / init.example.json as release
      # assets -- compose.yml is already embedded inside install-linux.sh
      # and install-macos.sh (users never need the raw file), and
      # init.example.json is a schema reference that lives in the repo.
      # Publishing both was noise -- 16 assets became 14 meaningful ones.

      - name: Upload bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-shell
          path: dist/

  # ───────────────────────────────────────────────────────────────────
  # build-fp-binaries: cross-compile the fp CLI for all 5 platforms and
  # publish them as release assets. Without this job the bundled
  # install-linux.sh would 404 on the fp-${arch} download URL because
  # only the Windows .exe artifact carries fp binaries (and only the
  # two it staged into WSL: fp-linux-amd64 and fp-windows-amd64.exe).
  #
  # This job is also why `curl -fsSL https://get.falconpulsar.com/linux
  # | sudo bash` actually completes end-to-end: the bundled installer
  # downloads fp-${arch} from releases/download/v${TAG}/, and these
  # files must exist there. Mirrors the standalone build-fp.yml that
  # validates on every main push.
  # ───────────────────────────────────────────────────────────────────
  build-fp-binaries:
    name: build fp (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: macos-amd64
          - goos: darwin
            goarch: arm64
            suffix: macos-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: console/go.sum

      - name: Build fp
        # -X cli.Version injection mirrors what build-fp.yml does on
        # tag pushes — the in-binary version string reports the tag
        # (minus the leading 'v') instead of the VERSION-synced
        # literal baked into cli.go.
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          cd console
          mkdir -p dist
          FP_VER="${GITHUB_REF_NAME#v}"
          echo "Building fp-${{ matrix.suffix }} with cli.Version=$FP_VER"
          go build \
              -ldflags="-s -w -X github.com/falconpulsar/falconpulsar-installer/console/internal/cli.Version=${FP_VER}" \
              -o "dist/fp-${{ matrix.suffix }}${{ matrix.ext }}" \
              ./cmd/fp
          ls -lh "dist/fp-${{ matrix.suffix }}${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fp-${{ matrix.suffix }}
          path: console/dist/fp-${{ matrix.suffix }}${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 1

  build-windows-exe:
    name: build windows installer .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Setup Go (for fp console CLI)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: console/go.sum

      - name: Build fp.exe wrapper (launches Linux fp inside WSL)
        # Must match build-windows.yml step-for-step: the wrapper is a
        # tiny stub in windows/fp-wrapper/ that execs the real Linux fp
        # via wsl.exe. installer.iss [Files] expects it at
        # ../console/dist/fp-windows-amd64.exe.
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          cd windows/fp-wrapper
          mkdir -p ../../console/dist
          go build -ldflags="-s -w" -o ../../console/dist/fp-windows-amd64.exe .
          ls -lh ../../console/dist/fp-windows-amd64.exe

      - name: Build Linux fp (staged into WSL at install time)
        # installer.iss [Files] at line 158 requires this binary; the
        # Windows installer copies it into WSL alongside the bash
        # installer and the Windows fp.exe wrapper execs it.
        #
        # ldflags -X injects the release version into cli.Version at
        # link time so `fp --version`, `fp about`, and the TUI About
        # modal show the actual release tag instead of the
        # VERSION-synced literal baked into cli.go. Strip the leading
        # "v" so the in-binary string matches the bare semver convention.
        shell: bash
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          cd console
          FP_VER="${GITHUB_REF_NAME#v}"
          echo "Building fp with cli.Version=$FP_VER (from tag $GITHUB_REF_NAME)"
          go build -ldflags="-s -w -X github.com/falconpulsar/falconpulsar-installer/console/internal/cli.Version=${FP_VER}" \
            -o dist/fp-linux-amd64 ./cmd/fp
          ls -lh dist/fp-linux-amd64

      - name: Build tray app
        shell: powershell
        run: |
          # Strip the leading "v" and any -alpha/-beta/-rc suffix. .NET's
          # System.Version only accepts numeric major.minor.build[.revision],
          # so v0.1.4-alpha.1 → 0.1.4 here. The full tag (with suffix) is
          # still what the GitHub Release page is named, so users see the
          # alpha designation in the right places; the assembly carries
          # the closest representable numeric version, which is what the
          # tray's About dialog reads via Assembly.GetName().Version.
          $rawTag = "${env:GITHUB_REF_NAME}"
          $trayVersion = $rawTag -replace '^v', '' -replace '-(alpha|beta|rc).*$', ''
          if ([string]::IsNullOrEmpty($trayVersion)) { $trayVersion = '0.1.0' }
          # InformationalVersion carries the FULL tag (pre-release suffix
          # included) — Application.ProductVersion reads it, so the tray can
          # compare its own version against the release feed at full
          # precision (System.Version can't hold "-alpha.N", hence the split).
          $trayInfoVersion = $rawTag -replace '^v', ''
          if ([string]::IsNullOrEmpty($trayInfoVersion)) { $trayInfoVersion = $trayVersion }
          Write-Host "Building tray with Version=$trayVersion InformationalVersion=$trayInfoVersion (from tag $rawTag)"
          dotnet publish windows/tray-app/FalconPulsarTray.csproj `
            -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$trayVersion `
            -p:InformationalVersion=$trayInfoVersion `
            -o windows/tray-app/publish

      - name: Install Inno Setup 6
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Generate wizard images from logo
        shell: powershell
        run: |
          & ".\windows\scripts\build-assets.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile installer.iss
        shell: powershell
        run: |
          # Inject the git tag (sans leading "v") into installer.iss as
          # MyAppVersion. This is the noble fix for the long-standing
          # "FalconPulsar-Setup-0.1.3.exe filename even on v0.1.4-alpha.3
          # release" bug -- previously the version was hardcoded in
          # installer.iss line 33 and never updated automatically.
          # Unlike the .NET tray's <Version>, Inno Setup accepts the full
          # semver pre-release suffix (-alpha.N, -beta.N, -rc.N), so we
          # don't need to strip it.
          $rawTag = "${env:GITHUB_REF_NAME}"
          $issVersion = $rawTag -replace '^v', ''
          if ([string]::IsNullOrEmpty($issVersion)) { $issVersion = 'dev' }
          Write-Host "Compiling installer.iss with MyAppVersion=$issVersion (from tag $rawTag)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
              "/DMyAppVersion=$issVersion" `
              "windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload .exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-windows
          path: windows/Output/*.exe

  build-macos-dmg:
    name: build macOS DMG (signed + notarized)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go (for fp console CLI bundled in the DMG)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: console/go.sum

      # ── Apple signing + notarization setup ─────────────────────────────
      # Every APPLE_* secret below must be present. A tag push with a
      # missing secret fails here rather than silently producing an
      # unsigned DMG: shipping "ERROR: you need to right-click Open" is
      # worse than aborting the release and fixing the secret.
      #
      # Secret names (set under Settings → Secrets and variables → Actions):
      #   APPLE_DEV_ID_APPLICATION_P12_BASE64    base64-encoded .p12 of the
      #                                          Developer ID Application
      #                                          cert (private key included)
      #   APPLE_DEV_ID_APPLICATION_P12_PASSWORD  password set when exporting
      #                                          the .p12 from Keychain Access
      #   APPLE_SIGNING_IDENTITY                 full cert CN, exactly as it
      #                                          appears in `security
      #                                          find-identity -v`, e.g.
      #                                          "Developer ID Application:
      #                                           Jane Doe (ABCD1234)"
      #   APPLE_NOTARY_KEY_ID                    App Store Connect API
      #                                          Key ID (10 chars)
      #   APPLE_NOTARY_ISSUER_ID                 issuer UUID for the team
      #   APPLE_NOTARY_KEY_P8_BASE64             base64-encoded .p8 private key
      #
      # The keychain password is NOT a secret — we generate a random one
      # inline and use it only to unlock the ephemeral build keychain,
      # which is deleted in the cleanup step.  No value in storing it.
      - name: Import Developer ID signing certificate
        env:
          APPLE_DEV_ID_APPLICATION_P12_BASE64:   ${{ secrets.APPLE_DEV_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEV_ID_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_DEV_ID_APPLICATION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_DEV_ID_APPLICATION_P12_BASE64:?secret APPLE_DEV_ID_APPLICATION_P12_BASE64 is required}"
          : "${APPLE_DEV_ID_APPLICATION_P12_PASSWORD:?secret APPLE_DEV_ID_APPLICATION_P12_PASSWORD is required}"

          # Fresh random keychain password for this job. 32 hex chars of
          # entropy from /dev/urandom — never reused, never persisted.
          KC_PASS="$(openssl rand -hex 32)"

          # Decode .p12 to a 600-mode file on /tmp (wiped at end of job).
          P12=/tmp/fp-cert.p12
          echo "$APPLE_DEV_ID_APPLICATION_P12_BASE64" | base64 --decode > "$P12"
          chmod 600 "$P12"

          # Create an ephemeral keychain scoped to this job only. We never
          # touch the runner's login keychain — makes cleanup trivial and
          # avoids any collision with pre-installed Apple certs on the image.
          KC=fp-build.keychain
          security create-keychain      -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600     "$KC"
          security unlock-keychain      -p "$KC_PASS" "$KC"
          security default-keychain     -s             "$KC"

          # Import cert + private key. `-T /usr/bin/codesign` whitelists
          # codesign to use the private key without triggering the
          # "allow access" GUI prompt (which a headless runner can't answer).
          security import "$P12" \
            -k "$KC" \
            -P "$APPLE_DEV_ID_APPLICATION_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # Grant codesign partition access non-interactively. Required
          # on macOS 10.12+; without it codesign still prompts at runtime.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PASS" "$KC"

          rm -f "$P12"
          unset KC_PASS

          echo '--- identities visible to codesign ---'
          security find-identity -v -p codesigning "$KC"

      - name: Write notary API key
        env:
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          : "${APPLE_NOTARY_KEY_P8_BASE64:?secret APPLE_NOTARY_KEY_P8_BASE64 is required}"
          mkdir -p "$RUNNER_TEMP/notary"
          KEY="$RUNNER_TEMP/notary/AuthKey.p8"
          echo "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          # Pass the path to the signed-build step via the job env.
          echo "FP_NOTARY_KEY_P8_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Build signed + notarized DMG
        # continue-on-error at the STEP level (not the job): the DMG is
        # best-effort by design — the publish job explicitly tolerates its
        # absence — so a notarization failure (e.g. a pending Apple Developer
        # agreement returning 403) must not paint the whole release run red.
        # A chronic red run buries real failures in alarm fatigue. The step
        # below turns a missing DMG into a prominent ::warning:: annotation
        # instead. (Job-level continue-on-error would also flip
        # needs.build-macos-dmg.result to 'success' for the publish job's
        # download gating — step-level keeps that semantics intact per-step.)
        id: dmg
        continue-on-error: true
        env:
          FP_SIGN:             '1'
          FP_SIGN_IDENTITY:    ${{ secrets.APPLE_SIGNING_IDENTITY }}
          FP_NOTARY_KEY_ID:    ${{ secrets.APPLE_NOTARY_KEY_ID }}
          FP_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          # FP_NOTARY_KEY_P8_PATH comes from the previous step via $GITHUB_ENV
        run: |
          set -euo pipefail
          : "${FP_SIGN_IDENTITY:?secret APPLE_SIGNING_IDENTITY is required}"
          : "${FP_NOTARY_KEY_ID:?secret APPLE_NOTARY_KEY_ID is required}"
          : "${FP_NOTARY_ISSUER_ID:?secret APPLE_NOTARY_ISSUER_ID is required}"
          chmod +x macos/build-dmg.sh
          FP_VERSION="${GITHUB_REF_NAME#v}" ./macos/build-dmg.sh
          cp dist/FalconPulsar-Setup.dmg "dist/FalconPulsar-Setup-${GITHUB_REF_NAME}.dmg"
          ls -lh dist/*.dmg

      - name: Report DMG outcome
        # Green run + loud warning when the DMG could not be produced. The
        # release still publishes (without the DMG) — that is by design.
        run: |
          if ls dist/FalconPulsar-Setup*.dmg >/dev/null 2>&1; then
            echo "DMG built, signed and notarized."
          else
            echo "::warning title=macOS DMG not produced::build-dmg.sh failed — the release publishes WITHOUT the DMG. Read the 'Build signed + notarized DMG' step log for the REAL cause; do not assume notarization. A Swift compile error and an Apple 403 both land here and look identical from outside, and alpha.79 shipped DMG-less on a compile error while this very message blamed notarization. The 'macOS apps compile' lint job now catches the compile case before a tag. macOS users can still install via install-macos.sh."
          fi

      - name: Cleanup signing materials
        # Runs even if a previous step failed — we never want the .p8 key
        # or the temporary keychain to survive past this job.
        if: always()
        run: |
          security delete-keychain fp-build.keychain 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary/AuthKey.p8" 2>/dev/null || true

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-macos
          path: dist/FalconPulsar-Setup*.dmg

  publish:
    name: create github release
    runs-on: ubuntu-latest
    needs: [bundle, build-fp-binaries, build-windows-exe, build-macos-dmg]
    # Publish even when build-macos-dmg fails. macOS DMG signing /
    # notarization / hdiutil packaging hits transient failures
    # (hdiutil detach EBUSY from mdworker, Apple notary throttling,
    # ephemeral runner DNS issues) that have nothing to do with the
    # Linux or Windows installers. Holding the entire release hostage
    # to one Mac flake means Linux/Windows users can't download the
    # bundled .sh / .exe / fp binaries until someone re-tags.
    #
    # The three CRITICAL jobs (bundle, build-fp-binaries,
    # build-windows-exe) must still succeed — without them we have
    # nothing to release.
    if: |
      always() &&
      needs.bundle.result == 'success' &&
      needs.build-fp-binaries.result == 'success' &&
      needs.build-windows-exe.result == 'success'
    permissions:
      contents: write
      actions: write   # dispatch prune-releases.yml after publishing
    steps:
      - name: Download shell bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-shell
          path: dist/

      - name: Download windows .exe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows
          path: dist/

      # macOS DMG is best-effort. If build-macos-dmg failed, this step
      # downloads nothing (continue-on-error) and the release goes out
      # without a DMG. Users on macOS can still install via the bundled
      # install-macos.sh which IS in bundles-shell.
      - name: Download macOS DMG (best-effort)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build-macos-dmg.result == 'success'
        continue-on-error: true
        with:
          name: bundles-macos
          path: dist/

      # The five fp-* artifacts are uploaded one-per-matrix-job from
      # build-fp-binaries. Use pattern + merge-multiple so they all
      # land flat in dist/ alongside the .sh / .exe / .dmg files.
      - name: Download fp binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fp-*
          path: dist/
          merge-multiple: true

      - name: Create unversioned aliases
        run: |
          # Windows .exe
          EXE=$(ls dist/FalconPulsar-Setup-*.exe 2>/dev/null | head -1)
          if [ -n "$EXE" ]; then
            cp "$EXE" dist/FalconPulsar-Setup.exe
          fi
          # macOS DMG
          DMG=$(ls dist/FalconPulsar-Setup-*.dmg 2>/dev/null | head -1)
          if [ -n "$DMG" ]; then
            cp "$DMG" dist/FalconPulsar-Setup.dmg
          fi

      - name: List release assets
        run: ls -lh dist/

      - name: Compute SHA-256 checksums
        # Canonical hashes users can verify their downloads against.
        # The published asset covers every file in dist/ (installers,
        # bundles, bootstrap, DMG, EXE) so integrity checks are
        # self-contained.  SECURITY.md's "compromised release artifacts"
        # section tells users how to use this.
        working-directory: dist
        run: |
          # Sort so the file is reproducible run-to-run.
          # Exclude SHA256SUMS.txt itself if it somehow leaks in.
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -I{} sha256sum {} \
            > SHA256SUMS.txt
          echo '--- SHA256SUMS.txt ---'
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Detect prerelease tags by suffix. Standard semver pre-release
          # identifiers are -alpha[.N], -beta[.N], -rc[.N]. When matched:
          #   --prerelease  → orange "Pre-release" badge on the release page
          #   --latest=false → don't move the /releases/latest pointer here,
          #                    so a prior stable release stays canonical
          # Stable tags (plain vN.N.N) get the normal release path.
          PRERELEASE_FLAGS=""
          PRERELEASE_TITLE_PREFIX=""
          PRERELEASE_NOTES=""
          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*)
              PRERELEASE_FLAGS="--prerelease --latest=false"
              PRERELEASE_TITLE_PREFIX="[Pre-release] "
              PRERELEASE_NOTES=$'\n> ⚠️  **Pre-release.** Bugs expected. Do not deploy to production. The `/releases/latest` link is unaffected by this tag.\n'
              ;;
          esac

          NOTES=$(cat <<EOF
          ${PRERELEASE_NOTES}
          See REQUIREMENTS.md for supported platforms.

          - **Linux / macOS:** \`curl -fsSL <url> | bash\`
          - **Windows:** download the .exe and double-click

          ### Verifying your download

          Every asset is listed in \`SHA256SUMS.txt\` with its canonical
          SHA-256 hash. To verify:

          \`\`\`
          # macOS / Linux
          shasum -a 256 -c SHA256SUMS.txt --ignore-missing

          # Windows (PowerShell)
          Get-FileHash .\FalconPulsar-Setup.exe -Algorithm SHA256
          \`\`\`

          If a hash does not match, **do not install** — see SECURITY.md
          for reporting instructions.
          EOF
          )
          # shellcheck disable=SC2086  # PRERELEASE_FLAGS is intentionally word-split
          gh release create "${GITHUB_REF_NAME}" \
            --title "${PRERELEASE_TITLE_PREFIX}FalconPulsar Installer ${GITHUB_REF_NAME}" \
            --notes "$NOTES" \
            --repo "${GITHUB_REPOSITORY}" \
            $PRERELEASE_FLAGS \
            dist/*

      - name: Trigger release retention prune
        # A release published with the workflow's own GITHUB_TOKEN does NOT
        # emit a `release: published` trigger for other workflows (GitHub's
        # recursion guard), so prune-releases.yml never fires for CI-cut
        # releases. workflow_dispatch is exempt from that guard — dispatch it
        # explicitly so retention (keep 2 newest) also applies here.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run prune-releases.yml --repo "${GITHUB_REPOSITORY}"
