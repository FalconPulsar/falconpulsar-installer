# =============================================================================
# release — bundle the Linux and macOS installers into a single self-contained
# script per platform and publish them as a GitHub Release on every v* tag.
#
# We bundle so that `curl -fsSL .../install-linux.sh | bash` works without
# requiring the user to clone the repo. The bundle inlines shared/lib/*.sh
# and shared/compose.yml into the install.sh so it can run standalone.
#
# Triggered by pushing a tag like v0.1.0.
# =============================================================================

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bundle:
    name: bundle linux + macos installers
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Bundle Linux installer
        run: |
          mkdir -p dist
          ./.github/scripts/bundle.sh linux > "dist/install-linux-${GITHUB_REF_NAME}.sh"
          chmod +x "dist/install-linux-${GITHUB_REF_NAME}.sh"
          # Unversioned alias for stable redirect URLs.
          cp "dist/install-linux-${GITHUB_REF_NAME}.sh" dist/install-linux.sh

      - name: Bundle Linux uninstaller
        run: |
          # Self-contained uninstall bundle for users whose machine no longer
          # has ~/falconpulsar/uninstall.sh (broken install, manual cleanup).
          # curl -fsSL .../uninstall-linux.sh | sudo bash
          ./.github/scripts/bundle.sh linux-uninstall > "dist/uninstall-linux-${GITHUB_REF_NAME}.sh"
          chmod +x "dist/uninstall-linux-${GITHUB_REF_NAME}.sh"
          cp "dist/uninstall-linux-${GITHUB_REF_NAME}.sh" dist/uninstall-linux.sh

      - name: Ship Linux bootstrap (dispatcher)
        run: |
          # linux.sh is the tiny dispatcher served at
          # https://get.falconpulsar.com/linux. It downloads both bundles
          # above on every run and execs the one the user asked for
          # (default: install; `-s -- uninstall` for uninstall).
          cp linux/bootstrap.sh "dist/linux-${GITHUB_REF_NAME}.sh"
          chmod +x "dist/linux-${GITHUB_REF_NAME}.sh"
          cp "dist/linux-${GITHUB_REF_NAME}.sh" dist/linux.sh

      - name: Bundle macOS installer
        run: |
          ./.github/scripts/bundle.sh macos > "dist/install-macos-${GITHUB_REF_NAME}.sh"
          chmod +x "dist/install-macos-${GITHUB_REF_NAME}.sh"
          cp "dist/install-macos-${GITHUB_REF_NAME}.sh" dist/install-macos.sh

      # No separate copy of compose.yml / init.example.json as release
      # assets -- compose.yml is already embedded inside install-linux.sh
      # and install-macos.sh (users never need the raw file), and
      # init.example.json is a schema reference that lives in the repo.
      # Publishing both was noise -- 16 assets became 14 meaningful ones.

      - name: Upload bundles
        uses: actions/upload-artifact@v5
        with:
          name: bundles-shell
          path: dist/

  build-windows-exe:
    name: build windows installer .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Go (for fp console CLI)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: console/go.sum

      - name: Build fp.exe wrapper (launches Linux fp inside WSL)
        # Must match build-windows.yml step-for-step: the wrapper is a
        # tiny stub in windows/fp-wrapper/ that execs the real Linux fp
        # via wsl.exe. installer.iss [Files] expects it at
        # ../console/dist/fp-windows-amd64.exe.
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          cd windows/fp-wrapper
          mkdir -p ../../console/dist
          go build -ldflags="-s -w" -o ../../console/dist/fp-windows-amd64.exe .
          ls -lh ../../console/dist/fp-windows-amd64.exe

      - name: Build Linux fp (staged into WSL at install time)
        # installer.iss [Files] at line 158 requires this binary; the
        # Windows installer copies it into WSL alongside the bash
        # installer and the Windows fp.exe wrapper execs it.
        shell: bash
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          cd console
          go build -ldflags="-s -w" -o dist/fp-linux-amd64 ./cmd/fp
          ls -lh dist/fp-linux-amd64

      - name: Build tray app
        shell: powershell
        run: |
          # Strip the leading "v" and any -alpha/-beta/-rc suffix. .NET's
          # System.Version only accepts numeric major.minor.build[.revision],
          # so v0.1.4-alpha.1 → 0.1.4 here. The full tag (with suffix) is
          # still what the GitHub Release page is named, so users see the
          # alpha designation in the right places; the assembly carries
          # the closest representable numeric version, which is what the
          # tray's About dialog reads via Assembly.GetName().Version.
          $rawTag = "${env:GITHUB_REF_NAME}"
          $trayVersion = $rawTag -replace '^v', '' -replace '-(alpha|beta|rc).*$', ''
          if ([string]::IsNullOrEmpty($trayVersion)) { $trayVersion = '0.1.0' }
          Write-Host "Building tray with Version=$trayVersion (from tag $rawTag)"
          dotnet publish windows/tray-app/FalconPulsarTray.csproj `
            -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$trayVersion `
            -o windows/tray-app/publish

      - name: Install Inno Setup 6
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Generate wizard images from logo
        shell: powershell
        run: |
          & ".\windows\scripts\build-assets.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile installer.iss
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload .exe
        uses: actions/upload-artifact@v5
        with:
          name: bundles-windows
          path: windows/Output/*.exe

  build-macos-dmg:
    name: build macOS DMG (signed + notarized)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go (for fp console CLI bundled in the DMG)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: console/go.sum

      # ── Apple signing + notarization setup ─────────────────────────────
      # Every APPLE_* secret below must be present. A tag push with a
      # missing secret fails here rather than silently producing an
      # unsigned DMG: shipping "ERROR: you need to right-click Open" is
      # worse than aborting the release and fixing the secret.
      #
      # Secret names (set under Settings → Secrets and variables → Actions):
      #   APPLE_DEV_ID_APPLICATION_P12_BASE64    base64-encoded .p12 of the
      #                                          Developer ID Application
      #                                          cert (private key included)
      #   APPLE_DEV_ID_APPLICATION_P12_PASSWORD  password set when exporting
      #                                          the .p12 from Keychain Access
      #   APPLE_SIGNING_IDENTITY                 full cert CN, exactly as it
      #                                          appears in `security
      #                                          find-identity -v`, e.g.
      #                                          "Developer ID Application:
      #                                           Jane Doe (ABCD1234)"
      #   APPLE_NOTARY_KEY_ID                    App Store Connect API
      #                                          Key ID (10 chars)
      #   APPLE_NOTARY_ISSUER_ID                 issuer UUID for the team
      #   APPLE_NOTARY_KEY_P8_BASE64             base64-encoded .p8 private key
      #
      # The keychain password is NOT a secret — we generate a random one
      # inline and use it only to unlock the ephemeral build keychain,
      # which is deleted in the cleanup step.  No value in storing it.
      - name: Import Developer ID signing certificate
        env:
          APPLE_DEV_ID_APPLICATION_P12_BASE64:   ${{ secrets.APPLE_DEV_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEV_ID_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_DEV_ID_APPLICATION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_DEV_ID_APPLICATION_P12_BASE64:?secret APPLE_DEV_ID_APPLICATION_P12_BASE64 is required}"
          : "${APPLE_DEV_ID_APPLICATION_P12_PASSWORD:?secret APPLE_DEV_ID_APPLICATION_P12_PASSWORD is required}"

          # Fresh random keychain password for this job. 32 hex chars of
          # entropy from /dev/urandom — never reused, never persisted.
          KC_PASS="$(openssl rand -hex 32)"

          # Decode .p12 to a 600-mode file on /tmp (wiped at end of job).
          P12=/tmp/fp-cert.p12
          echo "$APPLE_DEV_ID_APPLICATION_P12_BASE64" | base64 --decode > "$P12"
          chmod 600 "$P12"

          # Create an ephemeral keychain scoped to this job only. We never
          # touch the runner's login keychain — makes cleanup trivial and
          # avoids any collision with pre-installed Apple certs on the image.
          KC=fp-build.keychain
          security create-keychain      -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600     "$KC"
          security unlock-keychain      -p "$KC_PASS" "$KC"
          security default-keychain     -s             "$KC"

          # Import cert + private key. `-T /usr/bin/codesign` whitelists
          # codesign to use the private key without triggering the
          # "allow access" GUI prompt (which a headless runner can't answer).
          security import "$P12" \
            -k "$KC" \
            -P "$APPLE_DEV_ID_APPLICATION_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # Grant codesign partition access non-interactively. Required
          # on macOS 10.12+; without it codesign still prompts at runtime.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PASS" "$KC"

          rm -f "$P12"
          unset KC_PASS

          echo '--- identities visible to codesign ---'
          security find-identity -v -p codesigning "$KC"

      - name: Write notary API key
        env:
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          : "${APPLE_NOTARY_KEY_P8_BASE64:?secret APPLE_NOTARY_KEY_P8_BASE64 is required}"
          mkdir -p "$RUNNER_TEMP/notary"
          KEY="$RUNNER_TEMP/notary/AuthKey.p8"
          echo "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          # Pass the path to the signed-build step via the job env.
          echo "FP_NOTARY_KEY_P8_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Build signed + notarized DMG
        env:
          FP_SIGN:             '1'
          FP_SIGN_IDENTITY:    ${{ secrets.APPLE_SIGNING_IDENTITY }}
          FP_NOTARY_KEY_ID:    ${{ secrets.APPLE_NOTARY_KEY_ID }}
          FP_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          # FP_NOTARY_KEY_P8_PATH comes from the previous step via $GITHUB_ENV
        run: |
          set -euo pipefail
          : "${FP_SIGN_IDENTITY:?secret APPLE_SIGNING_IDENTITY is required}"
          : "${FP_NOTARY_KEY_ID:?secret APPLE_NOTARY_KEY_ID is required}"
          : "${FP_NOTARY_ISSUER_ID:?secret APPLE_NOTARY_ISSUER_ID is required}"
          chmod +x macos/build-dmg.sh
          FP_VERSION="${GITHUB_REF_NAME#v}" ./macos/build-dmg.sh
          cp dist/FalconPulsar-Setup.dmg "dist/FalconPulsar-Setup-${GITHUB_REF_NAME}.dmg"
          ls -lh dist/*.dmg

      - name: Cleanup signing materials
        # Runs even if a previous step failed — we never want the .p8 key
        # or the temporary keychain to survive past this job.
        if: always()
        run: |
          security delete-keychain fp-build.keychain 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary/AuthKey.p8" 2>/dev/null || true

      - name: Upload DMG
        uses: actions/upload-artifact@v5
        with:
          name: bundles-macos
          path: dist/FalconPulsar-Setup*.dmg

  publish:
    name: create github release
    runs-on: ubuntu-latest
    needs: [bundle, build-windows-exe, build-macos-dmg]
    permissions:
      contents: write
    steps:
      - name: Download shell bundles
        uses: actions/download-artifact@v5
        with:
          name: bundles-shell
          path: dist/

      - name: Download windows .exe
        uses: actions/download-artifact@v5
        with:
          name: bundles-windows
          path: dist/

      - name: Download macOS DMG
        uses: actions/download-artifact@v5
        with:
          name: bundles-macos
          path: dist/

      - name: Create unversioned aliases
        run: |
          # Windows .exe
          EXE=$(ls dist/FalconPulsar-Setup-*.exe 2>/dev/null | head -1)
          if [ -n "$EXE" ]; then
            cp "$EXE" dist/FalconPulsar-Setup.exe
          fi
          # macOS DMG
          DMG=$(ls dist/FalconPulsar-Setup-*.dmg 2>/dev/null | head -1)
          if [ -n "$DMG" ]; then
            cp "$DMG" dist/FalconPulsar-Setup.dmg
          fi

      - name: List release assets
        run: ls -lh dist/

      - name: Compute SHA-256 checksums
        # Canonical hashes users can verify their downloads against.
        # The published asset covers every file in dist/ (installers,
        # bundles, bootstrap, DMG, EXE) so integrity checks are
        # self-contained.  SECURITY.md's "compromised release artifacts"
        # section tells users how to use this.
        working-directory: dist
        run: |
          # Sort so the file is reproducible run-to-run.
          # Exclude SHA256SUMS.txt itself if it somehow leaks in.
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -I{} sha256sum {} \
            > SHA256SUMS.txt
          echo '--- SHA256SUMS.txt ---'
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Detect prerelease tags by suffix. Standard semver pre-release
          # identifiers are -alpha[.N], -beta[.N], -rc[.N]. When matched:
          #   --prerelease  → orange "Pre-release" badge on the release page
          #   --latest=false → don't move the /releases/latest pointer here,
          #                    so a prior stable release stays canonical
          # Stable tags (plain vN.N.N) get the normal release path.
          PRERELEASE_FLAGS=""
          PRERELEASE_TITLE_PREFIX=""
          PRERELEASE_NOTES=""
          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*)
              PRERELEASE_FLAGS="--prerelease --latest=false"
              PRERELEASE_TITLE_PREFIX="[Pre-release] "
              PRERELEASE_NOTES=$'\n> ⚠️  **Pre-release.** Bugs expected. Do not deploy to production. The `/releases/latest` link is unaffected by this tag.\n'
              ;;
          esac

          NOTES=$(cat <<EOF
          ${PRERELEASE_NOTES}
          See REQUIREMENTS.md for supported platforms.

          - **Linux / macOS:** \`curl -fsSL <url> | bash\`
          - **Windows:** download the .exe and double-click

          ### Verifying your download

          Every asset is listed in \`SHA256SUMS.txt\` with its canonical
          SHA-256 hash. To verify:

          \`\`\`
          # macOS / Linux
          shasum -a 256 -c SHA256SUMS.txt --ignore-missing

          # Windows (PowerShell)
          Get-FileHash .\FalconPulsar-Setup.exe -Algorithm SHA256
          \`\`\`

          If a hash does not match, **do not install** — see SECURITY.md
          for reporting instructions.
          EOF
          )
          # shellcheck disable=SC2086  # PRERELEASE_FLAGS is intentionally word-split
          gh release create "${GITHUB_REF_NAME}" \
            --title "${PRERELEASE_TITLE_PREFIX}FalconPulsar Installer ${GITHUB_REF_NAME}" \
            --notes "$NOTES" \
            --repo "${GITHUB_REPOSITORY}" \
            $PRERELEASE_FLAGS \
            dist/*
