# =============================================================================
# release — bundle the Linux and macOS installers into a single self-contained
# script per platform and publish them as a GitHub Release on every v* tag.
#
# We bundle so that `curl -fsSL .../install-linux.sh | bash` works without
# requiring the user to clone the repo. The bundle inlines shared/lib/*.sh
# and shared/compose.yml into the install.sh so it can run standalone.
#
# Triggered by pushing a tag like v0.1.0.
# =============================================================================

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bundle:
    name: bundle linux + macos installers
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Bundle Linux installer
        run: |
          mkdir -p dist
          ./.github/scripts/bundle.sh linux > "dist/install-linux-${GITHUB_REF_NAME}.sh"
          chmod +x "dist/install-linux-${GITHUB_REF_NAME}.sh"
          # Unversioned alias for stable redirect URLs (get.falconpulsar.com/linux)
          cp "dist/install-linux-${GITHUB_REF_NAME}.sh" dist/install-linux.sh

      - name: Bundle macOS installer
        run: |
          ./.github/scripts/bundle.sh macos > "dist/install-macos-${GITHUB_REF_NAME}.sh"
          chmod +x "dist/install-macos-${GITHUB_REF_NAME}.sh"
          cp "dist/install-macos-${GITHUB_REF_NAME}.sh" dist/install-macos.sh

      - name: Copy reference files
        run: |
          cp shared/init.example.json dist/
          cp shared/compose.yml dist/

      - name: Upload bundles
        uses: actions/upload-artifact@v5
        with:
          name: bundles-shell
          path: dist/

  build-windows-exe:
    name: build windows installer .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build tray app
        shell: powershell
        run: |
          dotnet publish windows/tray-app/FalconPulsarTray.csproj `
            -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -o windows/tray-app/publish

      - name: Install Inno Setup 6
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Generate wizard images from logo
        shell: powershell
        run: |
          & ".\windows\scripts\build-assets.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile installer.iss
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload .exe
        uses: actions/upload-artifact@v5
        with:
          name: bundles-windows
          path: windows/Output/*.exe

  build-macos-pkg:
    name: build macOS .pkg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build installer app
        run: |
          cd macos/installer-app
          swift build -c release

      - name: Build menu bar app
        run: |
          cd macos/menu-bar-app
          mkdir -p .build
          swiftc FalconPulsar/main.swift FalconPulsar/AppDelegate.swift FalconPulsar/Logo.swift \
            -o .build/FalconPulsarMenuBar \
            -framework AppKit -framework UserNotifications -O

      - name: Stage .app bundles
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ROOT=dist/pkg-root/Applications
          mkdir -p "$ROOT"

          # Installer .app
          APP="$ROOT/FalconPulsar Installer.app"
          mkdir -p "$APP/Contents/MacOS"
          cp macos/installer-app/.build/release/FalconPulsarInstaller "$APP/Contents/MacOS/"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>FalconPulsarInstaller</string>
            <key>CFBundleIdentifier</key><string>com.falconpulsar.installer</string>
            <key>CFBundleName</key><string>FalconPulsar Installer</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST

          # Menu bar .app
          APP="$ROOT/FalconPulsar Menu Bar.app"
          mkdir -p "$APP/Contents/MacOS"
          cp macos/menu-bar-app/.build/FalconPulsarMenuBar "$APP/Contents/MacOS/"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>FalconPulsarMenuBar</string>
            <key>CFBundleIdentifier</key><string>com.falconpulsar.menubar</string>
            <key>CFBundleName</key><string>FalconPulsar</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>LSUIElement</key><true/>
          </dict></plist>
          PLIST

      - name: Build .pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          pkgbuild \
            --root dist/pkg-root \
            --identifier com.falconpulsar.installer.pkg \
            --version "${VERSION}" \
            --install-location / \
            "dist/FalconPulsar-Setup-${GITHUB_REF_NAME}.pkg"
          cp "dist/FalconPulsar-Setup-${GITHUB_REF_NAME}.pkg" dist/FalconPulsar-Setup.pkg
          ls -lh dist/*.pkg

      - name: Upload .pkg
        uses: actions/upload-artifact@v5
        with:
          name: bundles-macos
          path: dist/FalconPulsar-Setup*.pkg

  publish:
    name: create github release
    runs-on: ubuntu-latest
    needs: [bundle, build-windows-exe, build-macos-pkg]
    permissions:
      contents: write
    steps:
      - name: Download shell bundles
        uses: actions/download-artifact@v5
        with:
          name: bundles-shell
          path: dist/

      - name: Download windows .exe
        uses: actions/download-artifact@v5
        with:
          name: bundles-windows
          path: dist/

      - name: Download macOS .pkg
        uses: actions/download-artifact@v5
        with:
          name: bundles-macos
          path: dist/

      - name: Create unversioned aliases
        run: |
          # Windows .exe
          EXE=$(ls dist/FalconPulsar-Setup-*.exe 2>/dev/null | head -1)
          if [ -n "$EXE" ]; then
            cp "$EXE" dist/FalconPulsar-Setup.exe
          fi
          # macOS .pkg (unversioned alias already created by build-pkg.sh)
          # Just verify it exists
          ls -lh dist/FalconPulsar-Setup.pkg 2>/dev/null || echo "No .pkg alias found"

      - name: List release assets
        run: ls -lh dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "FalconPulsar Installer ${GITHUB_REF_NAME}" \
            --notes "See REQUIREMENTS.md for supported platforms. Linux/macOS: \`curl -fsSL <url> | bash\`. Windows: download the .exe and double-click." \
            --repo "${GITHUB_REPOSITORY}" \
            dist/*
