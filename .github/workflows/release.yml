# =============================================================================
# release — bundle the Linux and macOS installers into a single self-contained
# script per platform and publish them as a GitHub Release on every v* tag.
#
# We bundle so that `curl -fsSL .../install-linux.sh | bash` works without
# requiring the user to clone the repo. The bundle inlines shared/lib/*.sh
# and shared/compose.yml into the install.sh so it can run standalone.
#
# Triggered by pushing a tag like v0.1.0.
# =============================================================================

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bundle:
    name: bundle linux + macos installers
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Bundle Linux installer
        run: |
          mkdir -p dist
          ./.github/scripts/bundle.sh linux > "dist/install-linux-${GITHUB_REF_NAME}.sh"
          chmod +x "dist/install-linux-${GITHUB_REF_NAME}.sh"
          # Unversioned alias for stable redirect URLs.
          cp "dist/install-linux-${GITHUB_REF_NAME}.sh" dist/install-linux.sh

      - name: Bundle Linux uninstaller
        run: |
          # Self-contained uninstall bundle for users whose machine no longer
          # has ~/falconpulsar/uninstall.sh (broken install, manual cleanup).
          # curl -fsSL .../uninstall-linux.sh | sudo bash
          ./.github/scripts/bundle.sh linux-uninstall > "dist/uninstall-linux-${GITHUB_REF_NAME}.sh"
          chmod +x "dist/uninstall-linux-${GITHUB_REF_NAME}.sh"
          cp "dist/uninstall-linux-${GITHUB_REF_NAME}.sh" dist/uninstall-linux.sh

      - name: Ship Linux bootstrap (dispatcher)
        run: |
          # linux.sh is the tiny dispatcher served at
          # https://get.falconpulsar.com/linux. It downloads both bundles
          # above on every run and execs the one the user asked for
          # (default: install; `-s -- uninstall` for uninstall).
          cp linux/bootstrap.sh "dist/linux-${GITHUB_REF_NAME}.sh"
          chmod +x "dist/linux-${GITHUB_REF_NAME}.sh"
          cp "dist/linux-${GITHUB_REF_NAME}.sh" dist/linux.sh

      - name: Bundle macOS installer
        run: |
          ./.github/scripts/bundle.sh macos > "dist/install-macos-${GITHUB_REF_NAME}.sh"
          chmod +x "dist/install-macos-${GITHUB_REF_NAME}.sh"
          cp "dist/install-macos-${GITHUB_REF_NAME}.sh" dist/install-macos.sh

      # No separate copy of compose.yml / init.example.json as release
      # assets -- compose.yml is already embedded inside install-linux.sh
      # and install-macos.sh (users never need the raw file), and
      # init.example.json is a schema reference that lives in the repo.
      # Publishing both was noise -- 16 assets became 14 meaningful ones.

      - name: Upload bundles
        uses: actions/upload-artifact@v5
        with:
          name: bundles-shell
          path: dist/

  build-windows-exe:
    name: build windows installer .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Go (for fp console CLI)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: console/go.sum

      - name: Build fp.exe wrapper (launches Linux fp inside WSL)
        # Must match build-windows.yml step-for-step: the wrapper is a
        # tiny stub in windows/fp-wrapper/ that execs the real Linux fp
        # via wsl.exe. installer.iss [Files] expects it at
        # ../console/dist/fp-windows-amd64.exe.
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          cd windows/fp-wrapper
          mkdir -p ../../console/dist
          go build -ldflags="-s -w" -o ../../console/dist/fp-windows-amd64.exe .
          ls -lh ../../console/dist/fp-windows-amd64.exe

      - name: Build Linux fp (staged into WSL at install time)
        # installer.iss [Files] at line 158 requires this binary; the
        # Windows installer copies it into WSL alongside the bash
        # installer and the Windows fp.exe wrapper execs it.
        shell: bash
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          cd console
          go build -ldflags="-s -w" -o dist/fp-linux-amd64 ./cmd/fp
          ls -lh dist/fp-linux-amd64

      - name: Build tray app
        shell: powershell
        run: |
          dotnet publish windows/tray-app/FalconPulsarTray.csproj `
            -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -o windows/tray-app/publish

      - name: Install Inno Setup 6
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Generate wizard images from logo
        shell: powershell
        run: |
          & ".\windows\scripts\build-assets.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile installer.iss
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload .exe
        uses: actions/upload-artifact@v5
        with:
          name: bundles-windows
          path: windows/Output/*.exe

  build-macos-dmg:
    name: build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go (for fp console CLI bundled in the DMG)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: console/go.sum

      - name: Build DMG via build-dmg.sh
        run: |
          chmod +x macos/build-dmg.sh
          FP_VERSION="${GITHUB_REF_NAME#v}" ./macos/build-dmg.sh
          cp dist/FalconPulsar-Setup.dmg "dist/FalconPulsar-Setup-${GITHUB_REF_NAME}.dmg"
          ls -lh dist/*.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v5
        with:
          name: bundles-macos
          path: dist/FalconPulsar-Setup*.dmg

  publish:
    name: create github release
    runs-on: ubuntu-latest
    needs: [bundle, build-windows-exe, build-macos-dmg]
    permissions:
      contents: write
    steps:
      - name: Download shell bundles
        uses: actions/download-artifact@v5
        with:
          name: bundles-shell
          path: dist/

      - name: Download windows .exe
        uses: actions/download-artifact@v5
        with:
          name: bundles-windows
          path: dist/

      - name: Download macOS DMG
        uses: actions/download-artifact@v5
        with:
          name: bundles-macos
          path: dist/

      - name: Create unversioned aliases
        run: |
          # Windows .exe
          EXE=$(ls dist/FalconPulsar-Setup-*.exe 2>/dev/null | head -1)
          if [ -n "$EXE" ]; then
            cp "$EXE" dist/FalconPulsar-Setup.exe
          fi
          # macOS DMG
          DMG=$(ls dist/FalconPulsar-Setup-*.dmg 2>/dev/null | head -1)
          if [ -n "$DMG" ]; then
            cp "$DMG" dist/FalconPulsar-Setup.dmg
          fi

      - name: List release assets
        run: ls -lh dist/

      - name: Compute SHA-256 checksums
        # Canonical hashes users can verify their downloads against.
        # The published asset covers every file in dist/ (installers,
        # bundles, bootstrap, DMG, EXE) so integrity checks are
        # self-contained.  SECURITY.md's "compromised release artifacts"
        # section tells users how to use this.
        working-directory: dist
        run: |
          # Sort so the file is reproducible run-to-run.
          # Exclude SHA256SUMS.txt itself if it somehow leaks in.
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -I{} sha256sum {} \
            > SHA256SUMS.txt
          echo '--- SHA256SUMS.txt ---'
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(cat <<EOF
          See REQUIREMENTS.md for supported platforms.

          - **Linux / macOS:** \`curl -fsSL <url> | bash\`
          - **Windows:** download the .exe and double-click

          ### Verifying your download

          Every asset is listed in \`SHA256SUMS.txt\` with its canonical
          SHA-256 hash. To verify:

          \`\`\`
          # macOS / Linux
          shasum -a 256 -c SHA256SUMS.txt --ignore-missing

          # Windows (PowerShell)
          Get-FileHash .\FalconPulsar-Setup.exe -Algorithm SHA256
          \`\`\`

          If a hash does not match, **do not install** — see SECURITY.md
          for reporting instructions.
          EOF
          )
          gh release create "${GITHUB_REF_NAME}" \
            --title "FalconPulsar Installer ${GITHUB_REF_NAME}" \
            --notes "$NOTES" \
            --repo "${GITHUB_REPOSITORY}" \
            dist/*
