# =============================================================================
# release — bundle the Linux and macOS installers into a single self-contained
# script per platform and publish them as a GitHub Release on every v* tag.
#
# We bundle so that `curl -fsSL .../install-linux.sh | bash` works without
# requiring the user to clone the repo. The bundle inlines shared/lib/*.sh
# and shared/compose.yml into the install.sh so it can run standalone.
#
# Triggered by pushing a tag like v0.1.0.
# =============================================================================

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bundle:
    name: bundle linux + macos installers
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Bundle Linux installer
        run: |
          mkdir -p dist
          ./.github/scripts/bundle.sh linux > "dist/install-linux-${GITHUB_REF_NAME}.sh"
          chmod +x "dist/install-linux-${GITHUB_REF_NAME}.sh"
          # Unversioned alias for stable redirect URLs (get.falconpulsar.com/linux)
          cp "dist/install-linux-${GITHUB_REF_NAME}.sh" dist/install-linux.sh

      - name: Bundle macOS installer
        run: |
          ./.github/scripts/bundle.sh macos > "dist/install-macos-${GITHUB_REF_NAME}.sh"
          chmod +x "dist/install-macos-${GITHUB_REF_NAME}.sh"
          cp "dist/install-macos-${GITHUB_REF_NAME}.sh" dist/install-macos.sh

      - name: Copy reference files
        run: |
          cp shared/init.example.json dist/
          cp shared/compose.yml dist/

      - name: Upload bundles
        uses: actions/upload-artifact@v5
        with:
          name: bundles-shell
          path: dist/

  build-windows-exe:
    name: build windows installer .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Go (for fp console CLI)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build fp.exe (to be bundled by the installer)
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          cd console
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/fp-windows-amd64.exe ./cmd/fp
          ls -lh dist/

      - name: Build tray app
        shell: powershell
        run: |
          dotnet publish windows/tray-app/FalconPulsarTray.csproj `
            -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -o windows/tray-app/publish

      - name: Install Inno Setup 6
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Generate wizard images from logo
        shell: powershell
        run: |
          & ".\windows\scripts\build-assets.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile installer.iss
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload .exe
        uses: actions/upload-artifact@v5
        with:
          name: bundles-windows
          path: windows/Output/*.exe

  build-macos-dmg:
    name: build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go (for fp console CLI bundled in the DMG)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build DMG via build-dmg.sh
        run: |
          chmod +x macos/build-dmg.sh
          FP_VERSION="${GITHUB_REF_NAME#v}" ./macos/build-dmg.sh
          cp dist/FalconPulsar-Setup.dmg "dist/FalconPulsar-Setup-${GITHUB_REF_NAME}.dmg"
          ls -lh dist/*.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v5
        with:
          name: bundles-macos
          path: dist/FalconPulsar-Setup*.dmg

  publish:
    name: create github release
    runs-on: ubuntu-latest
    needs: [bundle, build-windows-exe, build-macos-dmg]
    permissions:
      contents: write
    steps:
      - name: Download shell bundles
        uses: actions/download-artifact@v5
        with:
          name: bundles-shell
          path: dist/

      - name: Download windows .exe
        uses: actions/download-artifact@v5
        with:
          name: bundles-windows
          path: dist/

      - name: Download macOS DMG
        uses: actions/download-artifact@v5
        with:
          name: bundles-macos
          path: dist/

      - name: Create unversioned aliases
        run: |
          # Windows .exe
          EXE=$(ls dist/FalconPulsar-Setup-*.exe 2>/dev/null | head -1)
          if [ -n "$EXE" ]; then
            cp "$EXE" dist/FalconPulsar-Setup.exe
          fi
          # macOS DMG
          DMG=$(ls dist/FalconPulsar-Setup-*.dmg 2>/dev/null | head -1)
          if [ -n "$DMG" ]; then
            cp "$DMG" dist/FalconPulsar-Setup.dmg
          fi

      - name: List release assets
        run: ls -lh dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "FalconPulsar Installer ${GITHUB_REF_NAME}" \
            --notes "See REQUIREMENTS.md for supported platforms. Linux/macOS: \`curl -fsSL <url> | bash\`. Windows: download the .exe and double-click." \
            --repo "${GITHUB_REPOSITORY}" \
            dist/*
