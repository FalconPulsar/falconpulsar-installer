# =============================================================================
# build-windows — compile the Inno Setup installer on a Windows runner.
#
# Runs on every push that touches windows/, linux/, or shared/, plus on
# every v* tag. Uploads the resulting .exe as a workflow artifact. The
# release.yml workflow can pull this artifact and attach it to a GitHub
# Release.
#
# CI does NOT install WSL or run the .exe end-to-end — GitHub Actions
# Windows runners do not allow nested virtualization, so WSL2 cannot
# actually start inside them. The job's contract is "the .iss script
# compiles cleanly and produces a non-empty .exe". Real end-to-end testing
# happens on a Windows VM before each release.
# =============================================================================

name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: compile installer.iss
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Inno Setup 6
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          # Verify the compiler is on PATH
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe not found at $iscc after choco install"
            exit 1
          }
          Write-Host "ISCC.exe present at $iscc"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Go (for fp console CLI)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'
          cache-dependency-path: console/go.sum

      - name: Build fp.exe wrapper (launches Linux fp inside WSL)
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          # The Windows fp.exe is a tiny wrapper around `wsl.exe` that
          # forwards every command to the real Linux fp running inside
          # the user's WSL distro. Previously we cross-compiled the
          # full Go CLI for Windows, but that binary read state from
          # C:\Users\…\falconpulsar — which is the wrong filesystem
          # because the stack lives under /home/falconpulsar in WSL.
          cd windows/fp-wrapper
          mkdir -p ../../console/dist
          go build -ldflags="-s -w" \
              -o ../../console/dist/fp-windows-amd64.exe .
          ls -lh ../../console/dist/fp-windows-amd64.exe

      - name: Build Linux fp (staged into WSL at install time)
        # On tag pushes, inject the release version into cli.Version
        # via ldflags -X so the binary's `fp about` reports the real
        # tag. On non-tag pushes (PR / branch validation builds) the
        # cli.go fallback (a literal kept in sync with the VERSION
        # file by scripts/sync-version.sh) is the right thing -- those
        # binaries are CI validation, not distribution.
        shell: bash
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          cd console
          LDFLAGS="-s -w"
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v ]]; then
            FP_VER="${GITHUB_REF_NAME#v}"
            LDFLAGS="$LDFLAGS -X github.com/falconpulsar/falconpulsar-installer/console/internal/cli.Version=${FP_VER}"
            echo "Building fp with cli.Version=$FP_VER (from tag $GITHUB_REF_NAME)"
          fi
          go build -ldflags="$LDFLAGS" -o dist/fp-linux-amd64 ./cmd/fp
          ls -lh dist/fp-linux-amd64

      - name: Build tray app
        shell: powershell
        run: |
          # On tag pushes, inject the tag's numeric semver into the tray's
          # AssemblyVersion (so the About dialog shows the real version
          # instead of the csproj default). Strips leading "v" and any
          # -alpha/-beta/-rc suffix because .NET's System.Version doesn't
          # parse pre-release identifiers. On non-tag pushes (PR / branch
          # validation builds) the csproj default 0.1.0 is fine -- those
          # binaries are CI validation, not distribution.
          $verArgs = @()
          if ("${env:GITHUB_REF}" -match '^refs/tags/v') {
              $rawTag = "${env:GITHUB_REF_NAME}"
              $trayVersion = $rawTag -replace '^v', '' -replace '-(alpha|beta|rc).*$', ''
              if (-not [string]::IsNullOrEmpty($trayVersion)) {
                  # Full tag → InformationalVersion (Application.ProductVersion)
                  # so the tray self-compares against release feeds precisely.
                  $trayInfoVersion = $rawTag -replace '^v', ''
                  $verArgs = @("-p:Version=$trayVersion", "-p:InformationalVersion=$trayInfoVersion")
                  Write-Host "Building tray with Version=$trayVersion InformationalVersion=$trayInfoVersion (from tag $rawTag)"
              }
          }
          dotnet publish windows/tray-app/FalconPulsarTray.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            @verArgs `
            -o windows/tray-app/publish
          $exe = Get-ChildItem "windows/tray-app/publish/FalconPulsarTray.exe" -ErrorAction Stop
          Write-Host "Tray app built: $($exe.Name) ($([math]::Round($exe.Length / 1MB, 2)) MB)"

      - name: Generate wizard images from logo
        shell: powershell
        run: |
          # Produces windows/assets/header.bmp + welcome.bmp from
          # falcon-logo.png. Both are referenced from installer.iss
          # and would otherwise be missing at compile time (gitignored).
          & ".\windows\scripts\build-assets.ps1"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "build-assets.ps1 failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Compile installer.iss
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          # On tag pushes, inject MyAppVersion from the git tag so the
          # output filename, AppVersion, and About-dialog version line up
          # with the release. On non-tag pushes (PR / branch validation
          # builds) the installer.iss #define fallback (kept in sync with
          # the VERSION file by scripts/sync-version.sh) is appropriate --
          # those binaries are CI validation, not distribution.
          $defines = @()
          if ("${env:GITHUB_REF}" -match '^refs/tags/v') {
              $rawTag = "${env:GITHUB_REF_NAME}"
              $issVersion = $rawTag -replace '^v', ''
              if (-not [string]::IsNullOrEmpty($issVersion)) {
                  $defines += "/DMyAppVersion=$issVersion"
                  Write-Host "Compiling installer.iss with MyAppVersion=$issVersion (from tag $rawTag)"
              }
          }
          & $iscc @defines "windows\installer.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Verify the .exe was produced
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path "windows\Output" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No .exe found in windows\Output\"
            exit 1
          }
          $sizeMB = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "Built: $($exe.Name) (${sizeMB} MB)"
          if ($exe.Length -lt 100KB) {
            Write-Error "Built .exe is suspiciously small (less than 100 KB) - bundle is probably broken"
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: FalconPulsar-Setup-windows
          path: windows/Output/*.exe
          retention-days: 30
          if-no-files-found: error
