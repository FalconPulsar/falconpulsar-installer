name = "falconpulsar-redirector"
main = "worker.js"
# Use a reasonably recent compatibility date. Any date after streams API
# stabilisation works; pin and bump deliberately.
compatibility_date = "2024-11-01"

# Custom hostname binding -- this replaces the current 302 on
# get.falconpulsar.com. You need a Cloudflare-managed DNS record for the
# `get` subdomain (proxied, orange-cloud) before `wrangler deploy`.
# Trailing asterisks are important: the worker handles /linux, /macos,
# /windows, /version, /linux/install, etc.
routes = [
  { pattern = "get.falconpulsar.com/*", zone_name = "falconpulsar.com" },
]

[vars]
REPO_OWNER = "FalconPulsar"
REPO_NAME = "falconpulsar-installer"
# RELEASE_TAG = "v0.1.0"  # uncomment to pin a specific tag; omit for "latest"

# Secrets are set OUT OF BAND, never in this file:
#   wrangler secret put GITHUB_TOKEN
#
# Token scope:
#   fine-grained PAT, repo = FalconPulsar/falconpulsar-installer,
#   permissions = Contents: Read only.
#   (A read-only token is enough because the worker only hits the
#   releases API and downloads published assets.)
